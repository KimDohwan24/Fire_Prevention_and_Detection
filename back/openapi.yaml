                $ref: "#/components/schemas/EventDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/EventNotFound"

  # ---------------------------------------------------------------- 알림
  /api/alerts:
    get:
      tags: [alerts]
      summary: 내 알림 목록
      description: |
        토큰 주인에게 온 알림만 나온다. 최신순(`alert_no` 내림차순).
        **주기적으로 다시 부르지 않는다** — 화면을 열 때와 응답 등 행동 직후에만 조회한다
        (2026-08-11 폴링 폐기).
      security:
        - bearerAuth: []
      parameters:
        - name: alert_status
          in: query
          schema:
            $ref: "#/components/schemas/AlertStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AlertSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/alerts/{alert_no}/respond:
    post:
      tags: [alerts]
      summary: 알림 응답 (화재 확인 / 오탐 취소)
      description: |
        - `READ` — 화재로 확인. 즉시 119 신고 절차가 시작된다.
        - `CANCEL` — 오탐으로 취소. `alert_deadline_at` 이전에만 가능하며,
          유예가 지났으면 409 (`DEADLINE_PASSED`) — 이미 신고 절차로 넘어갔기 때문이다.

        > ⚠️ **유예는 기본 30초다** (`ALERT_DEADLINE_SEC`, 실제로는 스윕 주기 때문에 30~35초).
        > Swagger UI 로 손수 눌러 보면 이벤트 확정 → `alert_no` 확인 → 여기까지 오는 사이에
        > 유예가 지나 `CANCEL` 이 409 로 떨어지기 쉽다. 취소 흐름을 확인할 때는
        > 로컬 `.env` 에 `ALERT_DEADLINE_SEC=300` 처럼 넉넉히 잡고 테스트할 것.

        응답은 **이벤트 단위**로 적용된다. 확정 시 PUSH·SMS 두 알림이 동시에 나가는데
        한쪽에 응답하면 같은 이벤트의 나머지 미응답 알림도 같은 상태·같은 시각으로 닫힌다.

        이미 무응답(`NO_RESPONSE`)으로 넘어간 알림에 뒤늦게 `READ` 를 보내면
        받아주긴 하지만 `alert_status` 는 `NO_RESPONSE` 로 남는다 —
        '무응답으로 신고까지 갔다'는 이력을 지우지 않기 위해서다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AlertNo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [READ, CANCEL]
      responses:
        "200":
          description: 응답 처리 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  alert_no:
                    type: integer
                    format: int64
                  alert_status:
                    $ref: "#/components/schemas/AlertStatus"
                  alert_responded_at:
                    type: string
                    format: date-time
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: action 은 READ 또는 CANCEL 이어야 합니다.
                field: action
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotYourAlert"
        "404":
          $ref: "#/components/responses/AlertNotFound"
        "409":
          $ref: "#/components/responses/AlertConflict"

