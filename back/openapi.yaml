  # ---------------------------------------------------------------- ITS 공공 CCTV
  /api/its/cctvs:
    get:
      tags: [its]
      summary: 연동 가능한 ITS 공공 CCTV 목록
      description: |
        우리 DB 가 아니라 **ITS 오픈 API 를 그 자리에서 조회**해 돌려준다.
        카메라를 등록하려는 사용자가 "지금 붙일 수 있는 카메라"를 고르는 화면용이다.

        - **인증이 필요 없다.** 공개 개방 데이터를 중계하는 것이라 토큰 없이 부를 수 있다.
        - 좌표는 ITS 원본(`coordy`=위도, `coordx`=경도)을 우리 이름으로 정규화해 내려간다.
        - **바로 쓸 수 없는 항목은 빼고 준다** — 이름이 없거나, 스트림 주소가 없거나,
          좌표가 숫자로 읽히지 않는 항목은 목록에서 제외된다. 화면에서 고를 수 없는 것을
          보여줘 봐야 사용자가 눌렀을 때 실패할 뿐이다.
        - `total` 은 **페이지가 아니라 걸러낸 뒤의 전체 건수**다. `items` 는 그중 한 페이지다.

        실패하면 **503** 이다. `/api/cctvs` 는 ITS 가 죽어도 저장된 주소로 폴백해 200 을 내지만,
        여기는 폴백할 저장분이 없다. 빈 목록으로 위장하면 "카메라 없음"과 "서버 고장"을
        구분할 수 없다.
      parameters:
        - name: limit
          in: query
          description: 한 번에 받을 개수 (1~100). 벗어나면 400
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: 건너뛸 개수 (0 이상). 음수면 400
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: 조회 성공 (0건도 성공이다)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ItsCctv"
                  total:
                    type: integer
                    description: 걸러낸 뒤의 전체 건수 (items 는 그중 한 페이지)
                    example: 83
        "400":
          description: limit·offset 이 정수가 아니거나 허용 범위 밖 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: limit must be 1-100 and offset must be non-negative.
        "503":
          description: ITS 오픈 API 조회 실패 (`ITS_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: ITS_UNAVAILABLE
                message: ITS CCTV 목록을 조회할 수 없습니다.


  # ---------------------------------------------------------------- 이벤트
  /api/events:
    get:
      tags: [events]
      summary: 화재 이벤트 목록
      description: |
        최신순(`event_no` 내림차순). 카메라 이름·위치와 대표 이미지
        (`thumbnail_url`)를 함께 내려주므로 목록 화면에서 추가 호출이 필요 없다.

        시연·테스트로 만든 이벤트(`event_is_test`)는 기본으로 빠진다.
        보려면 `include_test=true`.
      security:
        - bearerAuth: []
      parameters:
        - name: event_status
          in: query
          schema:
            $ref: "#/components/schemas/EventStatus"
        - name: event_class
          in: query
          schema:
            $ref: "#/components/schemas/EventClass"
        - name: cctv_no
          in: query
          description: 특정 카메라의 이벤트만
          schema:
            type: integer
            format: int64
        - name: date_from
          in: query
          description: 검출 시각 시작 (해당일 포함)
          schema:
            type: string
            format: date
            example: "2026-08-01"
        - name: date_to
          in: query
          description: 검출 시각 종료 (해당일 포함)
          schema:
            type: string
            format: date
            example: "2026-08-10"
        - name: include_test
          in: query
          description: 테스트 이벤트 포함 여부
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/EventSummary"
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_int:
                  summary: 정수 파라미터 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: cctv_no 는 정수여야 합니다.
                    field: cctv_no
                bad_date:
                  summary: 날짜 파라미터 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: date_from 는 YYYY-MM-DD 형식이어야 합니다.
                    field: date_from
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/events/{event_no}:
    get:
      tags: [events]
      summary: 화재 이벤트 상세
      description: 카메라 정보 + 미디어(프레임·클립) + 알림 이력 + 119 신고 이력을 한 번에 준다.
      security:
