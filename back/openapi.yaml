  # ---------------------------------------------------------------- 신고
  /api/reports:
    get:
      tags: [reports]
      summary: 119 신고 이력
      description: |
        `event_no` 로 필터하면 그 화재 1건의 **승계 이력**이 통째로 나온다.
        `report_sequence` 는 기관을 몇 번째로 바꿨는지(바깥 루프),
        `report_attempt_count` 는 그 기관에 몇 번 쐈는지(안쪽 루프)다.
      security:
        - bearerAuth: []
      parameters:
        - name: report_status
          in: query
          schema:
            $ref: "#/components/schemas/ReportStatus"
        - name: event_no
          in: query
          description: 특정 이벤트의 승계 이력만
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Report"
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: event_no 는 정수여야 합니다.
                field: event_no
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/reports/dispatch:
    post:
      tags: [reports]
      summary: 소방서 출동 통지 수신
      description: |
        119 가 실제로 배차했을 때 되쏘는 콜백이다. 우리가 신고에 실어 보낸
        `callback_url` 이 이 경로를 가리킨다.

        인증은 JWT 가 아니라 공유 키(`X-Agency-Key`)다 — 상대가 사람이 아니라
        기관 서버다.

        멱등하다. 같은 통지가 여러 번 와도 신고 행이 늘지 않고 최신 값으로
        덮인다. 접수번호(`external_id`)가 어긋나거나 `dispatched_at` 형식이
        깨져도 거절하지 않는다 — 출동했다는 사실을 버리는 편이 더 나쁘다.
      security:
        - agencyKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_uid]
              additionalProperties: true
              properties:
                report_uid:
                  type: string
                  pattern: '^FG-\d+$'
                  description: 신고에 실어 보낸 신고 ID. 어느 화재인지 찾는 열쇠다
                  example: FG-42
                external_id:
                  type: string
                  description: 119 가 발급한 접수번호. 불일치해도 거절하지 않고 경고만 남긴다
                  example: R-000001
                agency_name:
                  type: string
                  example: 모의소방서 1
                dispatch_no:
                  type: string
                  description: 출동 지령 번호
                  example: D-R-000001
                vehicles:
                  type: integer
                  example: 3
                crew:
                  type: integer
                  example: 12
                eta_sec:
                  type: integer
                  description: 예상 도착까지 남은 초
                  example: 240
                dispatched_at:
                  type: string
                  format: date-time
                  description: 배차 시각. 없거나 형식이 깨지면 서버 수신 시각을 쓴다
                note:
                  type: string
                  example: 펌프차 2 · 구급차 1 출동
      responses:
        "200":
          description: 출동 통지 반영됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_no:
                    type: integer
                    format: int64
                  event_no:
                    type: integer
                    format: int64
                  report_status:
                    $ref: "#/components/schemas/ReportStatus"
                  report_dispatched_at:
                    type: string
                    format: date-time
        "400":
          description: report_uid 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: report_uid 는 'FG-<이벤트번호>' 형식이어야 합니다.
                field: report_uid
        "401":
          description: X-Agency-Key 불일치 (`AGENCY_UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: AGENCY_UNAUTHORIZED
                message: 기관 인증 키가 올바르지 않습니다.
        "404":
          description: |
            진행 중인 신고 없음 (`REPORT_NOT_FOUND`). 승계로 닫힌
            (`NO_RESPONSE`·`FAILED`) 신고만 남아 있으면 붙일 곳이 없다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: REPORT_NOT_FOUND
                message: 진행 중인 신고를 찾을 수 없습니다.

  /api/reports/{report_no}/logs:
    get:
      tags: [reports]
      summary: 119 송수신 로그
      description: |
        신고 1건이 실제로 무엇을 보내고 무엇을 받았는지 **전송 시도별로** 남긴 기록이다.
        `report_119` 는 결과 요약(상태·시도횟수·접수번호)만 갖고 있어서
        "몇 시에 뭘 보냈고 뭐라고 답이 왔길래 승계했나"를 따질 수 없었다.

        페이징하지 않는다 — 한 신고의 시도는 `MAX_REPORT_ATTEMPTS`(기본 4)건으로 묶인다.
        화재 1건의 전 구간을 보려면 `GET /api/reports?event_no=` 로 승계 이력을 받아
        각 `report_no` 의 로그를 이어 붙이면 된다.

        `log_result` 의 `TIMEOUT` 과 `ERROR` 는 뜻이 다르다. `TIMEOUT` 은 응답이
        안 왔을 뿐 **상대는 접수했을 수도 있다**(그래서 신고 ID 로 중복을 막는다).
        `ERROR` 는 연결 자체가 안 돼 전송되지 않은 것이다.
      security:
        - bearerAuth: []
      parameters:
        - name: report_no
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 조회 성공 (시도 순서대로)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReportLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ReportNotFound"

  # ---------------------------------------------------------------- 내부 (AI)
  /api/internal/cctvs:
    get:
      tags: [internal]
      summary: 감시 대상 카메라 목록 (AI 전용)
      description: |
        공개 목록과 같은 컬럼 + 최신 스트림 주소. 보통 `?cctv_status=ACTIVE` 로
        가동 중인 카메라만 받아 간다. ITS 스트림 주소의 토큰이 만료돼 재생이 끊기면
        이 엔드포인트를 다시 불러 새 주소로 재접속하면 된다.
      security:
        - internalKey: []
      parameters:
        - name: cctv_status
          in: query
          schema:
            $ref: "#/components/schemas/CctvStatus"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Cctv"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"

  /api/internal/detections:
    post:
      tags: [internal]
      summary: 검출 결과 수집 (AI 전용)
      description: |
        **프레임 1장** 단위로 보낸다. 백엔드가 프레임을 누적해 이벤트를 만들고,
        임계 프레임 수를 넘기면 이벤트를 `CONFIRMED` 로 확정하며 알림까지 발송한다.

        - `detections` 가 비었거나 화재 클래스가 없으면 이벤트를 만들지 않고
          `{ "event_no": null, "ignored": true }` 를 돌려준다.
        - 화재로 취급하는 클래스는 `flame`·`smoke` 뿐이다 (`person` 등은 판정에서 제외하되
          원본은 그대로 저장한다).
        - `captured_at` 을 생략하면 서버 수신 시각을 쓴다.
      security:
        - internalKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectionIngest"
      responses:
        "200":
          description: 수집 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionResult"
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_cctv_no:
                  summary: cctv_no 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: cctv_no 는 필수 정수입니다.
                    field: cctv_no
                bad_detections:
                  summary: detections 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: detections 는 리스트여야 합니다.
                    field: detections
                bad_captured_at:
                  summary: captured_at 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: captured_at 은 ISO 8601 형식이어야 합니다.
                    field: captured_at
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
        "404":
          $ref: "#/components/responses/CctvNotFound"

  # ---------------------------------------------------------------- 시스템
  /api/health:
    get:
      tags: [system]
      summary: 헬스체크
      description: 인증 없이 부를 수 있다. 서버가 떠 있는지만 본다.
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /media/{filename}:
    get:
      tags: [system]
      summary: 미디어 파일 서빙
      description: |
        검출 프레임(FRAME) 실제 파일. API 응답의 `media_url` /
        `thumbnail_url` 값이 곧 이 경로이므로 `<img src>` 에 그대로 넣으면 된다.

        **인증을 걸지 않는다** — 브라우저의 `<img>`/`<video>` 는 `Authorization`
        헤더를 붙일 수 없어 JWT 를 요구하면 화면에 아무것도 뜨지 않는다.
        (운영이라면 만료 시간이 든 서명 URL 또는 리버스 프록시 인증을 써야 한다.)

        저장 루트 바깥을 노리는 경로(`../`)는 404 로 막힌다.
      parameters:
        - name: filename
          in: path
          required: true
          description: 저장 루트 기준 상대 경로
          schema:
            type: string
          example: events/12/frame_001.jpg
      responses:
        "200":
          description: 파일 본문
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '로그인으로 받은 `access_token` 을 `Authorization: Bearer <token>` 으로 보낸다.'
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: AI 모델 전용. 서버의 `INTERNAL_API_KEY` 환경변수 값과 대조한다.
    agencyKey:
      type: apiKey
      in: header
      name: X-Agency-Key
      description: |
        소방서(119) 서버가 출동 통지를 되쏠 때 쓰는 공유 키.
        값은 백엔드의 `AGENCY_CALLBACK_KEY` 설정과 비교한다.

  parameters:
    Page:
      name: page
      in: query
      description: 페이지 번호 (1부터)
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      description: 페이지 크기 (최대 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserNo:
      name: user_no
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CctvNo:
      name: cctv_no
      in: path
      required: true
      schema:
        type: integer
        format: int64
    EventNo:
      name: event_no
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AlertNo:
      name: alert_no
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AgencyNo:
      name: agency_no
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OauthProvider:
      name: provider
      in: path
      required: true
      description: |
        소셜 로그인 제공자. 경로에는 **소문자**로 쓴다 (대문자로 보내도 받아준다).
        DB 의 `user_provider` 에는 항상 대문자로 저장된다.
      schema:
        type: string
        enum: [google, kakao, naver]
        example: google

  # 에러 응답은 반드시 example 을 단다 —
  # 없으면 Swagger UI 가 공통 Error 스키마로 본문을 만들어 내서 400·401·403 이
  # 전부 똑같이 보이고, 프론트가 분기할 code 를 화면에서 알아낼 수 없다.
  # (tests/test_openapi.py::test_error_responses_declare_example 가 강제한다)
  # 400 은 공통 응답을 두지 않는다 — 엔드포인트마다 실제로 나가는 문구와 field 가
  # 다르고, 공통 예시 하나를 돌려쓰면 카메라 등록 400 에 "user_id 는 필수입니다"
  # 같은 거짓 예시가 붙는다. 400 은 오퍼레이션 안에 직접 쓴다.
  responses:
    Unauthorized:
      description: |
        토큰 없음(`UNAUTHORIZED`) · 만료(`TOKEN_EXPIRED`) · 손상(`INVALID_TOKEN`) ·
        폐기(`TOKEN_REVOKED`). 넷 다 로그인 화면으로 돌려보내야 하지만,
        **안내 문구는 갈라주는 편이 낫다.**

        `TOKEN_REVOKED` 는 사용자가 잘못한 게 없는데 튕기는 경우다 — 다른 기기에서
        로그아웃했거나 관리자가 계정을 정지했을 때 나온다. 이유를 안 알려주면
        사용자는 영문도 모르고 튕긴 것으로 느낀다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              summary: 토큰 없음
              value:
                code: UNAUTHORIZED
                message: 인증 토큰이 필요합니다.
            expired:
              summary: 토큰 만료
              value:
                code: TOKEN_EXPIRED
                message: 토큰이 만료되었습니다. 다시 로그인해주세요.
            invalid:
              summary: 토큰 손상
              value:
                code: INVALID_TOKEN
                message: 유효하지 않은 토큰입니다.
            revoked:
              summary: 토큰 폐기 (로그아웃·계정 정지)
              value:
                code: TOKEN_REVOKED
                message: 로그아웃되었거나 무효화된 토큰입니다. 다시 로그인해주세요.

    Forbidden:
      description: 관리자 권한 필요 (`FORBIDDEN`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: FORBIDDEN
            message: 관리자 권한이 필요합니다.

    NotFound:
      description: 리소스 없음 (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: 리소스를 찾을 수 없습니다.

    InvalidCredentials:
      description: |
        아이디 또는 비밀번호 불일치 (`INVALID_CREDENTIALS`).
        존재하지 않는 아이디와 비밀번호 오류를 **구분하지 않는다** —
        구분하면 계정 존재 여부를 확인하는 통로가 된다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_CREDENTIALS
            message: 아이디 또는 비밀번호가 일치하지 않습니다.

    AccountBlocked:
      description: |
        정지·탈퇴 계정. 비밀번호가 맞아야 여기까지 온다 (틀리면 401 이 먼저 나간다).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            suspended:
              summary: 정지된 계정
              value:
                code: ACCOUNT_SUSPENDED
                message: 정지된 계정입니다.
            withdrawn:
              summary: 탈퇴한 계정
              value:
                code: ACCOUNT_WITHDRAWN
                message: 탈퇴한 계정입니다.

    ForbiddenUserUpdate:
      description: |
        남의 계정을 수정하려 했거나(`FORBIDDEN`), 일반 사용자가 관리자 전용 필드
        (`user_role`·`user_status`)를 건드리려 한 경우. 후자는 요청 전체가 거부된다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            not_mine:
              summary: 남의 계정
              value:
                code: FORBIDDEN
                message: 본인 계정만 수정할 수 있습니다.
            admin_only_field:
              summary: 관리자 전용 필드
              value:
                code: FORBIDDEN
                message: 권한 등급과 계정 상태는 관리자만 변경할 수 있습니다.

    DuplicateUserId:
      description: 이미 사용 중인 아이디 (`DUPLICATE_USER_ID`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: DUPLICATE_USER_ID
            message: 이미 사용 중인 아이디입니다.

    UserNotFound:
      description: 사용자 없음 (`USER_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: USER_NOT_FOUND
            message: 사용자를 찾을 수 없습니다.

    CctvNotFound:
      description: 카메라 없음 (`CCTV_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: CCTV_NOT_FOUND
            message: 카메라를 찾을 수 없습니다.

    EventNotFound:
      description: 이벤트 없음 (`EVENT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: EVENT_NOT_FOUND
            message: 이벤트를 찾을 수 없습니다.

    AlertNotFound:
      description: 알림 없음 (`ALERT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: ALERT_NOT_FOUND
            message: 알림을 찾을 수 없습니다.

    NotYourAlert:
      description: 다른 사용자의 알림 (`NOT_YOUR_ALERT`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_YOUR_ALERT
            message: 다른 사용자의 알림입니다.

    AlertConflict:
      description: |
        이미 응답했거나(`ALREADY_RESPONDED`), 취소 유예가 지난(`DEADLINE_PASSED`) 알림.
        `DEADLINE_PASSED` 는 이미 119 신고 절차로 넘어갔다는 뜻이라 되돌릴 수 없다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            already_responded:
              summary: 이미 응답함
              value:
                code: ALREADY_RESPONDED
                message: 이미 응답한 알림입니다.
            deadline_passed:
              summary: 취소 유예 경과
              value:
                code: DEADLINE_PASSED
                message: 취소 유예 시간이 지났습니다.

    AgencyNotFound:
      description: 소방서 없음 (`AGENCY_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: AGENCY_NOT_FOUND
            message: 소방서를 찾을 수 없습니다.

    ReportNotFound:
      description: 신고 없음 (`REPORT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: REPORT_NOT_FOUND
            message: 신고를 찾을 수 없습니다.

    InternalUnauthorized:
      description: 내부 API 키 불일치 (`INTERNAL_UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INTERNAL_UNAUTHORIZED
            message: 내부 API 키가 올바르지 않습니다.

  schemas:

    # ---------- 공통 ----------
    Error:
      type: object
      description: |
        모든 에러 응답의 공통 형식.

        `field` 는 검증 실패(400)에서 **어느 입력 때문인지** 가리킬 수 있을 때만
        실린다. 400 은 `code` 가 전부 `BAD_REQUEST` 하나라, 이게 없으면 프론트가
        폼의 어느 칸에 메시지를 붙일지 정하려고 한글 문구를 파싱해야 한다.
        입력 하나를 특정할 수 없는 400(예: "수정할 필드가 없습니다")과
        400 이 아닌 에러에는 키 자체가 없다.
      required: [code, message]
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          description: 사용자에게 그대로 보여줄 수 있는 한글 메시지
          example: user_id 는 필수입니다.
        field:
          type: string
          description: 문제가 된 요청 필드·쿼리 파라미터 이름 (없을 수 있음)
          example: user_id

    PageMeta:
      type: object
      description: 페이징 목록 봉투. `total_count` 가 0 이면 `total_pages` 도 0 이다.
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        total_count:
          type: integer
          example: 137
        total_pages:
          type: integer
          example: 7

    # ---------- enum ----------
    UserRole:
      type: string
      enum: [ADMIN, VIEWER]
    UserStatus:
      type: string
      description: |
        `ACTIVE` 정상 · `PENDING` 관리자 승격 승인 대기 · `SUSPENDED` 정지 · `WITHDRAWN` 탈퇴.

        `PENDING` 은 **권한만 기다리는 정상 계정**이다 — 로그인도 되고 아이디 찾기·비밀번호
        재설정도 된다. 권한은 그동안 `VIEWER` 그대로이며, 관리자가 승인하면 `ADMIN`·`ACTIVE`,
        거절하면 `VIEWER`·`ACTIVE` 로 돌아간다 (POST /api/admin/request-upgrade).
      enum: [ACTIVE, PENDING, SUSPENDED, WITHDRAWN]
    CctvStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    EventStatus:
      type: string
      description: |
        `PENDING` 관측 창에서 누적 중 · `CONFIRMED` 화재 확정 ·
        `DISMISSED` 오탐 취소 또는 창 안에서 임계 프레임 수를 못 채워 기준미달
      enum: [PENDING, CONFIRMED, DISMISSED]
    EventClass:
      type: string
      description: 불꽃·연기가 함께 잡히면 `FLAME_SMOKE`
      enum: [FLAME, SMOKE, FLAME_SMOKE]
    AlertChannel:
      type: string
      description: 확정 시 두 채널이 동시에 나간다 (PUSH = 인앱 알림 목록에 남는 행, SMS = 실제 발송)
      enum: [PUSH, SMS]
    AlertStatus:
      type: string
      description: |
        `SENT` 발송됨 · `READ` 화재 확인 · `CANCELED` 오탐 취소 ·
        `NO_RESPONSE` 유예 내 무응답(119 신고로 넘어감)
      enum: [SENT, READ, CANCELED, NO_RESPONSE]
    ReportLog:
      type: object
      description: 119 로 전송한 시도 1회의 기록 (`GET /api/reports/{report_no}/logs`)
      properties:
        log_no:
          type: integer
          format: int64
        report_no:
          type: integer
          format: int64
        log_attempt:
          type: integer
          description: 그 기관에 몇 번째로 쐈나 (1부터)
          example: 1
        log_endpoint:
          type: string
          description: 실제로 전송한 기관 주소
          example: http://localhost:6000/report?mode=ok
        log_request:
          type: object
          additionalProperties: true
          description: 보낸 신고 본문 그대로
        log_result:
          $ref: "#/components/schemas/ReportLogResult"
        log_http_status:
          type: integer
          nullable: true
          description: 응답 HTTP 상태코드. 응답이 없었으면 `null`
          example: 200
        log_response:
          type: object
          additionalProperties: true
          nullable: true
          description: 받은 응답 본문. 본문이 없거나 JSON 이 아니면 `null`
        log_error:
          type: string
          nullable: true
          description: 전송 실패 사유 (타임아웃·연결실패). 응답을 받았으면 `null`
        log_elapsed_ms:
          type: integer
          description: 요청부터 응답(또는 실패)까지 걸린 시간(ms)
          example: 42
        log_sent_at:
          type: string
          format: date-time

    ReportLogResult:
      type: string
      description: |
        `ACCEPTED` 2xx 접수 확인 · `REJECTED` 2xx 아닌 응답 ·
        `TIMEOUT` 응답 없음 · `ERROR` 연결 실패 등 전송 자체가 안 됨

        `TIMEOUT` 은 **상대가 접수했을 수도 있다**는 뜻이다. 그래서 재전송에
        같은 신고 ID(`report_uid`)를 실어 중복 접수를 막는다.
      enum: [ACCEPTED, REJECTED, TIMEOUT, ERROR]

    ReportStatus:
      type: string
      description: |
        `SENDING` 전송 중 · `ACCEPTED` 119 서버가 신고를 받았다고 응답 ·
        `DISPATCHED` 소방서가 실제로 배차했다고 회신 ·
        `NO_RESPONSE` 무응답이라 다음 기관으로 승계 · `FAILED` 모든 기관 소진

        `ACCEPTED` 는 **접수 확인까지**를 뜻한다. 2xx 응답은 "신고를 받았다"이지
        "소방차가 배차됐다"가 아니다. 배차는 119 가 `POST /api/reports/dispatch` 로
        따로 회신하며, 그때 `DISPATCHED` 가 된다 — **'출동'으로 표기해도 되는
        상태는 `DISPATCHED` 하나뿐이다.**

        진행 중으로 보는 상태는 `SENDING` · `ACCEPTED` · `DISPATCHED` 세 개이고,
        이벤트당 하나만 존재할 수 있다 (DB 부분 유니크 인덱스).
      enum: [SENDING, ACCEPTED, DISPATCHED, NO_RESPONSE, FAILED]

    # ---------- 계정 ----------
    LoginUser:
      type: object
      description: 로그인 직후 화면에 바로 필요한 최소 정보
      properties:
        user_no:
          type: integer
          format: int64
        user_id:
          type: string
        user_name:
          type: string
          nullable: true
        user_role:
          $ref: "#/components/schemas/UserRole"

    Me:
      type: object
      properties:
        user_no:
          type: integer
          format: int64
        user_id:
          type: string
        user_name:
          type: string
          nullable: true
        user_email:
          type: string
          nullable: true
        user_phone:
          type: string
          nullable: true
          description: 하이픈 없이 숫자만
        user_role:
          $ref: "#/components/schemas/UserRole"
        user_status:
          $ref: "#/components/schemas/UserStatus"

    UserSummary:
      type: object
      properties:
        user_no:
          type: integer
          format: int64
        user_id:
          type: string
        user_name:
          type: string
          nullable: true
        user_email:
          type: string
          nullable: true
        user_phone:
          type: string
          nullable: true
        user_role:
          $ref: "#/components/schemas/UserRole"
        user_status:
          $ref: "#/components/schemas/UserStatus"
        user_created_at:
          type: string
          format: date-time
          nullable: true

    ActivityType:
      type: string
      description: |
        | 값 | 언제 | `activity_target_no` |
        |---|---|---|
        | `LOGIN` | 로그인 성공 | 없음 |
        | `LOGOUT` | 로그아웃 | 없음 |
        | `PASSWORD_CHANGED` | 비밀번호 변경 성공 | 관리자 변경이면 대상 `user_no` |
        | `PROFILE_UPDATED` | 프로필 수정 성공 | 수정된 `user_no` |
        | `FIRE_CONFIRMED` | 알림에 화재 확인(`READ`) 응답 | `event_no` |
        | `FIRE_DISMISSED` | 알림에 오탐 취소(`CANCEL`) 응답 | `event_no` |

        **실패한 시도는 들어오지 않는다** — 로그인 실패, 거절된 조치 모두 제외다
        (침입 시도·오조작은 활동 이력이 아니다).

        ⚠️ `PUT /api/users/password` 로 바꾼 비밀번호는 아직 `PASSWORD_CHANGED` 가
        남지 않는다. 그 경로만 기록이 빠져 있고 별도로 붙일 예정이다.
      enum: [LOGIN, LOGOUT, PASSWORD_CHANGED, PROFILE_UPDATED,
             FIRE_CONFIRMED, FIRE_DISMISSED]

    UserActivity:
      type: object
      description: |
        사용자 활동이력 1행 (`GET /api/me/activities`,
        `GET /api/users/{user_no}/activities`).
        사용자 1명에 N행이 쌓인다. IP·User-Agent 는 수집하지 않는다.

        `user_no` 는 **행위자**다. 관리자가 남의 계정을 고친 행은 관리자의
        `user_no` 에 쌓이고 `activity_target_no` 가 수정당한 계정을 가리킨다.
      properties:
        activity_no:
          type: integer
          format: int64
        user_no:
          type: integer
          format: int64
          description: 행위자
        activity_type:
          $ref: "#/components/schemas/ActivityType"
        activity_target_no:
          type: integer
          format: int64
          nullable: true
          description: |
            대상 번호. 종류에 따라 `event_no` 이거나 `user_no` 다
            (어느 쪽인지는 `ActivityType` 표 참고). 대상이 없는 종류는 `null`.
        activity_detail:
          type: string
          nullable: true
          description: 화면에 그대로 띄울 한 줄 요약. 없을 수 있다.
        activity_at:
          type: string
          format: date-time
          description: 활동 일시
      example:
        activity_no: 42
        user_no: 1
        activity_type: FIRE_CONFIRMED
        activity_target_no: 12
        activity_detail: 정문 카메라 화재 확인
        activity_at: "2026-08-14T09:12:33"

    UserCreate:
      type: object
      required: [user_id, user_pw, user_name, user_role]
      properties:
        user_id:
          type: string
          pattern: "^[a-z][a-z0-9_-]{4,19}$"
          example: user02
        user_pw:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: "Fire#123"
        user_name:
          type: string
          example: 홍길동
        user_role:
          $ref: "#/components/schemas/UserRole"
        user_email:
          type: string
          nullable: true
        user_phone:
          type: string
          nullable: true
          pattern: "^01[016789][0-9]{7,8}$"
          example: "01012345678"
        user_gender:
          type: string
          nullable: true
        user_address:
          type: string
          nullable: true

    UserUpdate:
      type: object
      description: 보낸 필드만 갱신된다. 하나도 없으면 400.
      properties:
        user_name:
          type: string
        user_email:
          type: string
          nullable: true
        user_phone:
          type: string
          nullable: true
          description: 지우려면 `null` 을 보낸다 (빈 문자열은 형식 오류)
          pattern: "^01[016789][0-9]{7,8}$"
        user_pw:
          type: string
          format: password
        user_gender:
          type: string
          nullable: true
        user_address:
          type: string
          nullable: true
        user_role:
          allOf:
            - $ref: "#/components/schemas/UserRole"
          description: ADMIN 만 변경 가능
        user_status:
          allOf:
            - $ref: "#/components/schemas/UserStatus"
          description: ADMIN 만 변경 가능. `WITHDRAWN` 이면 탈퇴 일시가 함께 기록된다

    # ---------- 카메라 ----------
    ItsCctv:
      type: object
      description: |
        ITS 오픈 API 항목을 우리 스키마 이름으로 정규화한 것. **DB 행이 아니다** —
        `cctv_no` 가 없고, 등록하려면 이 값들로 `POST /api/cctvs` 를 부르면 된다.
        이름·스트림 주소·좌표가 온전한 항목만 목록에 실리므로 이 필드들은 null 이 아니다.
      properties:
        cctv_name:
          type: string
          description: ITS `cctvname`. 노선+지점 표기다
          example: "[경부선] 양재IC"
        cctv_location:
          type: string
          description: ITS `roadsectionid` — 없으면 이름을 그대로 넣는다
          example: "[경부선] 양재IC"
        cctv_type:
          type: string
          description: 스트림 형식 (ITS `cctvformat`). 값이 없으면 `ITS`
          example: HLS
        cctv_lat:
          type: number
          format: double
          description: ITS `coordy` (**위도**)
          example: 37.472145
        cctv_lng:
          type: number
          format: double
          description: ITS `coordx` (**경도**)
          example: 127.042125
        cctv_stream_url:
          type: string
          description: HLS 주소. 시간 제한 토큰이 박혀 있어 오래 두면 만료된다

    Cctv:
      type: object
      properties:
        cctv_no:
          type: integer
          format: int64
        user_no:
          type: integer
          format: int64
          description: 등록한 관리자
        cctv_name:
          type: string
          nullable: true
        cctv_location:
          type: string
          nullable: true
        cctv_address:
          type: string
          nullable: true
          description: |
            좌표를 역지오코딩한 주소 (도로명 또는 지번). 119 신고에 싣는 값이다.
            `cctv_location` 은 사람이 붙인 설치 위치 설명이라 주소가 아니다.
            변환에 실패했거나 컬럼 추가 이전에 등록된 카메라는 `null`.
        cctv_lat:
          type: number
          format: double
          nullable: true
          example: 37.5665
        cctv_lng:
          type: number
          format: double
          nullable: true
          example: 126.9780
        cctv_stream_url:
          type: string
          nullable: true
          description: ITS 카메라면 응답 시점의 최신 주소로 갈아끼워 나간다
        cctv_width:
          type: integer
          nullable: true
        cctv_height:
          type: integer
          nullable: true
        cctv_status:
          $ref: "#/components/schemas/CctvStatus"
        cctv_created_at:
          type: string
          format: date-time
          nullable: true

    CctvCreate:
      type: object
      required: [cctv_name, cctv_location, cctv_lat, cctv_lng, cctv_stream_url]
      properties:
        cctv_name:
          type: string
        cctv_location:
          type: string
        cctv_lat:
          type: number
          format: double
          description: 숫자로 보낸다 ("37.5" 같은 문자열은 400)
        cctv_lng:
          type: number
          format: double
        cctv_stream_url:
          type: string
        cctv_width:
          type: integer
          nullable: true
        cctv_height:
          type: integer
          nullable: true

    CctvUpdate:
      type: object
      description: 보낸 필드만 갱신된다. 하나도 없으면 400.
      properties:
        cctv_name:
          type: string
        cctv_location:
          type: string
        cctv_lat:
          type: number
          format: double
        cctv_lng:
          type: number
          format: double
        cctv_stream_url:
          type: string
        cctv_width:
          type: integer
        cctv_height:
          type: integer
        cctv_status:
          $ref: "#/components/schemas/CctvStatus"

    # ---------- 이벤트 ----------
    EventSummary:
      type: object
      properties:
        event_no:
          type: integer
          format: int64
        cctv_no:
          type: integer
          format: int64
        cctv_name:
          type: string
          nullable: true
        cctv_location:
          type: string
          nullable: true
        event_status:
          $ref: "#/components/schemas/EventStatus"
        event_class:
          $ref: "#/components/schemas/EventClass"
        event_first_detected_at:
          type: string
          format: date-time
          nullable: true
          description: 첫 프레임이 잡힌 시각
        event_detected_at:
          type: string
          format: date-time
          nullable: true
          description: 화재로 확정된 시각 (PENDING 이면 null)
        event_confidence:
          type: number
          format: double
          nullable: true
          example: 0.9231
        event_is_test:
          type: boolean
        thumbnail_url:
          type: string
          nullable: true
          description: 대표 이미지 경로 (`<img src>` 에 그대로 사용)
          example: /media/events/12/frame_001.jpg

    EventDetail:
      type: object
      properties:
        event_no:
          type: integer
          format: int64
        event_status:
          $ref: "#/components/schemas/EventStatus"
        event_class:
          $ref: "#/components/schemas/EventClass"
        event_first_detected_at:
          type: string
          format: date-time
          nullable: true
        event_detected_at:
          type: string
          format: date-time
          nullable: true
        event_detected_frames:
          type: integer
          nullable: true
          description: 지금까지 누적된 화재 프레임 수
        event_threshold_frames:
          type: integer
          nullable: true
          description: 확정에 필요한 프레임 수
        event_confidence:
          type: number
          format: double
          nullable: true
        event_is_test:
          type: boolean
        cctv:
          $ref: "#/components/schemas/EventCctv"
        media:
          type: array
          items:
            $ref: "#/components/schemas/Media"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        reports:
          type: array
          description: 승계 순서대로 쌓인 119 신고 이력
          items:
            $ref: "#/components/schemas/EventReport"

    EventCctv:
      type: object
      description: 상세 화면용 카메라 요약 (지도 표시에 좌표가 필요하다)
      properties:
        cctv_no:
          type: integer
          format: int64
        cctv_name:
          type: string
          nullable: true
        cctv_location:
          type: string
          nullable: true
        cctv_lat:
          type: number
          format: double
          nullable: true
        cctv_lng:
          type: number
          format: double
          nullable: true

    Media:
      type: object
      description: 대표 이미지(`media_is_primary`)가 먼저 나온다
      properties:
        media_no:
          type: integer
          format: int64
        media_url:
          type: string
          nullable: true
          example: /media/events/12/frame_001.jpg
        media_confidence:
          type: number
          format: double
          nullable: true
        media_captured_at:
          type: string
          format: date-time
          nullable: true
        media_is_primary:
          type: boolean
        media_detections:
          type: array
          nullable: true
          description: AI 가 보낸 원본 검출 배열 (화재 외 클래스도 그대로 보관)
          items:
            $ref: "#/components/schemas/Detection"

    # ---------- 알림 ----------
    Alert:
      type: object
      description: 이벤트 상세에 붙는 알림 이력
      properties:
        alert_no:
          type: integer
          format: int64
        user_no:
          type: integer
          format: int64
        user_name:
          type: string
          nullable: true
        alert_channel:
          $ref: "#/components/schemas/AlertChannel"
        alert_status:
          $ref: "#/components/schemas/AlertStatus"
        alert_sent_at:
          type: string
          format: date-time
          nullable: true
        alert_deadline_at:
          type: string
          format: date-time
          nullable: true
          description: 이 시각까지 응답이 없으면 119 신고로 넘어간다
        alert_responded_at:
          type: string
          format: date-time
          nullable: true

    AlertSummary:
      type: object
      description: 내 알림 목록용 — 어떤 화재인지 바로 보이도록 이벤트·카메라 정보를 얹었다
      properties:
        alert_no:
          type: integer
          format: int64
        event_no:
          type: integer
          format: int64
        event_class:
          $ref: "#/components/schemas/EventClass"
        cctv_name:
          type: string
          nullable: true
        alert_channel:
          $ref: "#/components/schemas/AlertChannel"
        alert_status:
          $ref: "#/components/schemas/AlertStatus"
        alert_sent_at:
          type: string
          format: date-time
          nullable: true
        alert_deadline_at:
          type: string
          format: date-time
          nullable: true
        alert_responded_at:
          type: string
          format: date-time
          nullable: true

    # ---------- 소방서 ----------
    Agency:
      type: object
      properties:
        agency_no:
          type: integer
          format: int64
        agency_name:
          type: string
          nullable: true
        agency_lat:
          type: number
          format: double
          nullable: true
        agency_lng:
          type: number
          format: double
          nullable: true
        agency_endpoint:
          type: string
          nullable: true
          description: 신고를 쏘는 주소 (시연에서는 가상 119 서버)
          example: http://localhost:6000/report
        agency_is_active:
          type: boolean

    AgencyCreate:
      type: object
      required: [agency_name, agency_lat, agency_lng, agency_endpoint]
      properties:
        agency_name:
          type: string
        agency_lat:
          type: number
          format: double
        agency_lng:
          type: number
          format: double
        agency_endpoint:
          type: string

    AgencyUpdate:
      type: object
      description: 보낸 필드만 갱신된다. 하나도 없으면 400.
      properties:
        agency_name:
          type: string
        agency_lat:
          type: number
          format: double
        agency_lng:
          type: number
          format: double
        agency_endpoint:
          type: string
        agency_is_active:
          type: boolean

    # ---------- 신고 ----------
    Report:
      type: object
      properties:
        report_no:
          type: integer
          format: int64
        event_no:
          type: integer
          format: int64
        agency_no:
          type: integer
          format: int64
        agency_name:
          type: string
          nullable: true
        report_sequence:
          type: integer
          nullable: true
          description: 기관을 몇 번째로 바꿨나 (승계 순서)
        report_external_id:
          type: string
          nullable: true
          description: 소방서가 돌려준 접수번호
        report_trigger_reason:
          type: string
          nullable: true
          description: 신고를 시작한 이유
          example: NO_RESPONSE_TIMEOUT
        report_status:
          $ref: "#/components/schemas/ReportStatus"
        report_address:
          type: string
          nullable: true
        report_distance_km:
          type: number
          format: double
          nullable: true
          description: CCTV 좌표에서 그 소방서까지의 거리
        report_attempt_count:
          type: integer
          nullable: true
          description: 그 기관에 몇 번 쐈나 (최대 4)
        reported_at:
          type: string
          format: date-time
          nullable: true
        report_accepted_at:
          type: string
          format: date-time
          nullable: true
        report_dispatched_at:
          type: string
          format: date-time
          nullable: true
          description: 소방서 출동 통지를 받은 시각. 아직 배차 회신이 없으면 `null`
        report_dispatch:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            소방서가 보낸 출동 정보 원문 (지령번호·차량 수·ETA 등). 기관마다
            보내는 키가 다를 수 있어 스키마를 고정하지 않고 그대로 보관한다.
          example:
            agency_name: 모의소방서 1
            dispatch_no: D-R-000001
            vehicles: 3
            eta_sec: 240
            received_at: "2026-08-18T14:32:11"

    EventReport:
      type: object
      description: 이벤트 상세에 붙는 신고 이력 (목록용 Report 의 축약본)
      properties:
        report_no:
          type: integer
          format: int64
        agency_no:
          type: integer
          format: int64
        agency_name:
          type: string
          nullable: true
        report_sequence:
          type: integer
          nullable: true
        report_status:
          $ref: "#/components/schemas/ReportStatus"
        report_distance_km:
          type: number
          format: double
          nullable: true
        reported_at:
          type: string
          format: date-time
          nullable: true
        report_accepted_at:
          type: string
          format: date-time
          nullable: true
        report_dispatched_at:
          type: string
          format: date-time
          nullable: true
          description: 소방서 출동 통지를 받은 시각. 아직 배차 회신이 없으면 `null`
        report_dispatch:
          type: object
          additionalProperties: true
          nullable: true
          description: 소방서가 보낸 출동 정보 원문 (지령번호·차량 수·ETA 등)

    # ---------- 내부 (AI) ----------
    Detection:
      type: object
      description: 프레임 1장에서 잡힌 박스 1개
      properties:
        cls:
          type: string
          description: 화재로 취급하는 값은 `flame`·`smoke` 뿐 (그 외는 판정에서 제외)
          example: flame
        conf:
          type: number
          format: double
          example: 0.87
        bbox:
          type: array
          description: "[x1, y1, x2, y2] 픽셀 좌표"
          items:
            type: number
          minItems: 4
          maxItems: 4

    DetectionIngest:
      type: object
      required: [cctv_no, detections]
      properties:
        cctv_no:
          type: integer
          format: int64
        captured_at:
          type: string
          format: date-time
          nullable: true
          description: 생략하면 서버 수신 시각을 쓴다 (ISO 8601)
        media_url:
          type: string
          nullable: true
          description: 저장된 프레임 이미지 경로
          example: /media/events/12/frame_001.jpg
        detections:
          type: array
          description: 빈 배열이면 무시된다 (이벤트를 만들지 않는다)
          items:
            $ref: "#/components/schemas/Detection"

    DetectionResult:
      type: object
      description: |
        화재 클래스가 없으면 `{ "event_no": null, "ignored": true }`,
        있으면 누적 상태를 돌려준다.
      properties:
        event_no:
          type: integer
          format: int64
          nullable: true
        ignored:
          type: boolean
          description: 화재 클래스가 없어 무시된 프레임일 때만 `true`
        event_status:
          $ref: "#/components/schemas/EventStatus"
        event_detected_frames:
          type: integer
          description: 지금까지 누적된 화재 프레임 수
        event_threshold_frames:
          type: integer
          description: 확정에 필요한 프레임 수
