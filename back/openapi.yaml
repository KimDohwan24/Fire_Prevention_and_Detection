# 파이어가드 API 스펙 (OpenAPI 3.0)
#
# 이 파일이 프론트에 나가는 계약서다. 손으로 관리하며, 라우트를 고치고 여기를
# 안 고치면 tests/test_openapi.py 가 빨간불로 잡는다 (경로·메서드·인증 대조).
#
# 서빙:  GET /api/docs/        Swagger UI
#        GET /api/openapi.yaml 원본 (TS 타입 생성기 입력)
openapi: 3.0.3

info:
  title: 파이어가드 API
  version: 0.7.0
  description: |
    CCTV 화재 감지 → 관리자 알림 → 무응답 시 119 자동 신고·승계 백엔드 API.

    ## 공통 규칙
    - 모든 필드는 `snake_case`, 날짜·시각은 ISO 8601 (`2026-08-10T14:30:00`)
    - 인증은 `Authorization: Bearer <access_token>` (로그인·헬스체크·미디어 제외)
    - AI 모델 전용 `/api/internal/*` 은 JWT 대신 `X-Internal-Key` 헤더를 쓴다
    - 에러는 어떤 상황에서도 `{ "code": "...", "message": "..." }` 형태다.
      검증 실패(400)는 어느 입력 탓인지 가리킬 수 있으면 `field` 가 하나 더 붙는다
      (`{ "code": "BAD_REQUEST", "message": "...", "field": "user_pw" }`) —
      400 은 `code` 가 전부 `BAD_REQUEST` 라, 폼 입력칸에 메시지를 붙일 때 이걸 쓴다
    - 목록 중 페이징이 있는 것은 `items / page / size / total_count / total_pages`
      봉투로 감싸 내려간다 (`/api/cctvs`, `/api/agencies` 는 페이징 없이 `items` 만)

    ## 실시간 알림 — 폴링하지 않는다 (2026-08-11 확정)
    WebSocket·SSE 뿐 아니라 **폴링도 쓰지 않는다**. 119 신고가 화재확인(`POST /api/alerts/{alert_no}/respond`)
    요청 안에서 **동기로** 끝나므로, 기다렸다가 알려줄 상태 변화가 없다.
    - 사람을 깨우는 채널은 **SMS** 다. 문자를 보고 앱을 열면 그때 목록을 한 번 조회하면 된다.
    - 남은 시간 카운트다운은 응답에 실린 `alert_deadline_at` 으로 클라이언트가 로컬 계산한다.
    - 화면 갱신 원칙: **열 때 조회 + 행동 후 갱신**.

    ## 판정·유예 기본값 (2026-08-10 변경)
    | 값 | 기본 | 뜻 |
    |---|---|---|
    | `EVENT_WINDOW_SEC` | 60초 | 관측 창. **최초 감지 시각에 고정**되며 이후 검출로 연장되지 않는다 |
    | `EVENT_THRESHOLD_FRAMES` | 30 | 창 안에서 이만큼 쌓이면 화재 확정. 미달인 채 창이 닫히면 `DISMISSED` |
    | `ALERT_DEADLINE_SEC` | 30초 | 알림 응답 유예. **이전 `ALERT_DEADLINE_MIN`(3분)에서 바뀐 값** |
    | `ESCALATION_INTERVAL_SEC` | 5초 | 무응답 스윕 주기. 신고가 최대 이만큼 늦어져 실제 유예는 30~35초 |

    Swagger UI 로 취소(`CANCEL`) 흐름을 손수 확인할 때는 30초가 짧아 409 가 나기 쉽다.
    로컬 `.env` 에서 `ALERT_DEADLINE_SEC` 를 넉넉히 올리고 테스트할 것.

servers:
  - url: http://localhost:5000
    description: 로컬 개발 서버

tags:
  - name: auth
    description: 인증 (로그인·세션 복원)
  - name: users
    description: 관리자 계정
  - name: cctvs
    description: 연동 카메라
  - name: its
    description: ITS(국가교통정보센터) 공공 CCTV 조회 — 등록할 카메라 고르기
  - name: events
    description: 화재 이벤트
  - name: alerts
    description: 관리자 알림
  - name: agencies
    description: 소방서
  - name: reports
    description: 119 신고 이력
  - name: internal
    description: AI 모델 전용 내부 API
  - name: system
    description: 헬스체크·미디어 서빙

paths:

# ---------------------------------------------------------------- 관리자 권한 승인
  /api/admin/request-upgrade:
    post:
      tags:
        - users
      summary: 관리자 권한 승인 요청
      description: |
        일반 회원이 관리자 권한 승인을 요청한다. 계정 상태가 `USER` 에서 `PENDING` (승인 대기)으로 변경된다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 관리자 권한 승인 요청이 완료되었습니다.
        "400":
          description: 이미 관리자이거나 대기 중인 경우 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                already_admin:
                  summary: 이미 관리자 계정
                  value:
                    code: ALREADY_ADMIN
                    message: 이미 관리자 계정입니다.
                already_pending:
                  summary: 이미 승인 대기 중인 계정
                  value:
                    code: ALREADY_PENDING
                    message: 이미 승인 대기 중인 계정입니다.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/admin/handle-request/{target_user_no}:
    patch:
      tags:
        - users
      summary: 관리자 권한 승인/거절 처리 (ADMIN)
      description: |
        관리자가 승인 대기(`PENDING`) 중인 유저의 요청을 처리한다.
        - `action: "approve"` 면 `ADMIN` 으로 승격시킨다.
        - `action: "reject"` 면 다시 `USER` 로 원복한다.
      security:
        - bearerAuth: []
      parameters:
        - name: target_user_no
          in: path
          required: true
          description: 처리할 대상 유저 번호
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                  example: approve
      responses:
        "200":
          description: 처리 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: admin01 님의 관리자 승인이 완료되었습니다.
        "400":
          description: 대기 중이 아니거나 잘못된 액션 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_pending:
                  summary: 대기 중인 유저가 아님
                  value:
                    code: NOT_PENDING
                    message: 승인 대기 중인 유저가 아닙니다.
                invalid_action:
                  summary: 잘못된 액션 값
                  value:
                    code: INVALID_ACTION
                    message: 올바르지 않은 액션입니다. ('approve' 또는 'reject' 입력 필요)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
  # ---------------------------------------------------------------- 인증
  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: |
        아이디·비밀번호로 JWT 를 발급받는다. 정지(SUSPENDED)·탈퇴(WITHDRAWN)
        계정은 비밀번호가 맞아도 403 이다.
        로그인에는 비밀번호 작성규칙을 적용하지 않는다 (기존 계정 보장).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, user_pw]
              properties:
                user_id:
                  type: string
                  example: admin01
                user_pw:
                  type: string
                  format: password
                  example: "Fire#123"
      responses:
        "200":
          description: 발급 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: Bearer 토큰
                  user:
                    $ref: "#/components/schemas/LoginUser"
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: user_id 는 필수입니다.
                field: user_id
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/AccountBlocked"

  /api/auth/me:
    get:
      tags: [auth]
      summary: 내 정보
      description: 새로고침 후 세션 복원용. 토큰의 주인 정보를 DB 에서 다시 읽어 준다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/auth/find-id:
    post:
      tags: [auth]
      summary: 아이디 찾기
      description: |
        이름 + 이메일이 일치하면 아이디를 **부분 마스킹**해 돌려준다 (`admin01` → `adm****`).

        통째로 주지 않는 이유: 이름과 이메일은 팀 안에서 대개 알려진 정보라,
        전체를 돌려주면 그 조합을 아는 사람에게 계정 목록을 넘기는 셈이 된다.
        본인이라면 앞 3자로 알아본다.

        **탈퇴·정지 계정은 찾아지지 않는다** (404). 되찾아도 로그인이 막혀 있고,
        비활성 계정의 존재를 확인해 주는 것 자체가 불필요한 노출이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name, user_email]
              properties:
                user_name:
                  type: string
                  example: 관리자
                user_email:
                  type: string
                  format: email
                  example: admin@fg.kr
      responses:
        "200":
          description: 일치하는 계정을 찾음
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    description: 앞 3자만 남기고 마스킹된 아이디
                    example: adm****
        "400":
          description: 필수값 누락 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: user_email 는 필수입니다.
                field: user_email
        "404":
          description: 일치하는 계정 없음 (`USER_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: USER_NOT_FOUND
                message: 일치하는 계정을 찾을 수 없습니다.

  /api/auth/password-reset/request:
    post:
      tags: [auth]
      summary: 비밀번호 재설정 — 인증코드 발급
      description: |
        아이디 + 이름 + 이메일이 일치하면 인증코드를 만들어 **등록된 연락처로 SMS 발송**한다.
        받은 코드로 `/api/auth/password-reset/confirm` 을 부르면 비밀번호가 바뀐다.

        ⚠️ **정보가 틀려도 200 이 나간다.** 404 를 내면 조합을 바꿔가며 찔러 실재 계정을
        골라낼 수 있어서다. 응답만으로는 계정 존재 여부를 알 수 없다 — 프론트는
        "정보가 일치하면 문자를 보냈다"는 안내만 띄우고 다음 단계로 넘기면 된다.

        ⚠️ **코드는 응답 본문에 실리지 않는다.** 넣으면 인증 단계가 무의미해진다.
        개발 중에는 목(mock) SMS 발송기가 서버 로그에 찍으므로 그것으로 확인하면 된다.

        코드는 서버에 저장되지 않고 매 요청마다 계산해 대조한다. 그래서
        **비밀번호가 바뀌는 순간 이전 코드는 자동으로 무효**가 된다 (1회용).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, user_name, user_email]
              properties:
                user_id:
                  type: string
                  example: admin01
                user_name:
                  type: string
                  example: 관리자
                user_email:
                  type: string
                  format: email
                  example: admin@fg.kr
      responses:
        "200":
          description: 접수됨 (정보 일치 여부와 무관하게 같은 응답이다)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 정보가 일치하면 등록된 연락처로 인증코드를 보냈습니다.
                  expires_in_sec:
                    type: integer
                    description: 코드 유효시간(초). 발급 시점에 따라 최대 30초 짧아질 수 있다
                    example: 300
        "400":
          description: 필수값 누락 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: user_email 는 필수입니다.
                field: user_email

  /api/auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: 비밀번호 재설정 — 인증코드 확인 후 변경
      description: |
        인증코드가 맞으면 새 비밀번호로 바꾼다. 성공하면 새 비밀번호로 바로 로그인하면 된다.

        - 코드는 **대소문자·공백을 가리지 않는다**. 문자로 받은 값을 소문자로 치거나
          중간에 공백을 넣어도 통과한다 (`ABCDE FGHJK` = `abcdefghjk`).
        - 비밀번호 작성규칙은 **가입할 때와 똑같이** 적용된다. 재설정으로 규칙을
          우회할 수 있으면 규칙을 둔 의미가 없다.
        - 코드가 틀렸을 때와 아이디가 없을 때의 응답이 **같다** (`INVALID_RESET_CODE`).
          아이디 존재 여부를 흘리지 않기 위해서다.
        - 성공하면 방금 쓴 코드는 그 자리에서 무효가 된다 (해시가 바뀌므로 재사용 불가).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, code, user_pw]
              properties:
                user_id:
                  type: string
                  example: admin01
                code:
                  type: string
                  description: SMS 로 받은 10자리 인증코드
                  example: KQ7MB2XZP4
                user_pw:
                  type: string
                  format: password
                  description: 새 비밀번호. 영문+숫자+특수문자 3종 포함 8~64자
                  example: "Reset#2026x"
      responses:
        "200":
          description: 변경 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 비밀번호가 변경되었습니다. 새 비밀번호로 로그인해주세요.
        "400":
          description: 인증코드 불일치·만료 또는 비밀번호 규칙 위반
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_code:
                  summary: 코드가 틀렸거나 만료됨 (아이디가 없을 때도 같은 응답)
                  value:
                    code: INVALID_RESET_CODE
                    message: 인증코드가 올바르지 않거나 만료되었습니다.
                password_rule:
                  summary: 새 비밀번호가 작성규칙 위반
                  value:
                    code: BAD_REQUEST
                    message: 비밀번호는 영문자·숫자·특수문자를 모두 포함해 8자 이상이어야 합니다.
                    field: user_pw

  # ---------------------------------------------------------------- 계정
  /api/users:
    get:
      tags: [users]
      summary: 계정 목록 (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: user_status
          in: query
          description: 계정 상태 필터
          schema:
            $ref: "#/components/schemas/UserStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [users]
      summary: 계정 등록 (ADMIN)
      description: |
        아이디·비밀번호 작성규칙을 여기서만 검사한다.
        - `user_id`: 5~20자, 영문 소문자 시작, 소문자·숫자·`_`·`-`
        - `user_pw`: 영문+숫자+특수문자 3종 포함 8~64자.
          같은 문자 3연속·연속 문자열(1234, abcd)·키보드 배열(qwer)·아이디 포함 금지
        - `user_phone`: 하이픈 없이 숫자만 (`01012345678`)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_no:
                    type: integer
                    format: int64
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                required:
                  summary: 필수값 누락
                  value:
                    code: BAD_REQUEST
                    message: user_name 는 필수입니다.
                    field: user_name
                user_id_rule:
                  summary: 아이디 작성규칙 위반
                  value:
                    code: BAD_REQUEST
                    message: user_id 는 5~20자의 영문 소문자·숫자·특수기호(_,-)만 사용할 수 있으며, 시작은 영문 소문자여야 합니다.
                    field: user_id
                password_rule:
                  summary: 비밀번호 작성규칙 위반
                  value:
                    code: BAD_REQUEST
                    message: 비밀번호는 영문자·숫자·특수문자를 모두 포함해 8자 이상이어야 합니다.
                    field: user_pw
                phone_format:
                  summary: 전화번호 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: "user_phone 은 하이픈 없이 숫자만 입력해야 합니다. (예: 01012345678)"
                    field: user_phone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/DuplicateUserId"

  /api/users/{user_no}:
    put:
      tags: [users]
      summary: 계정 수정 · 정지 · 탈퇴
      description: |
        ADMIN 은 모든 계정의 모든 필드를, 일반 사용자는 **본인 계정의**
        `user_name`·`user_email`·`user_phone`·`user_gender`·`user_address`·`user_pw`
        만 수정할 수 있다. `user_role`·`user_status` 가 하나라도 섞이면 요청 전체를
        403 으로 거부한다 (부분 적용 없음).

        `user_status: "WITHDRAWN"` 을 보내면 탈퇴 일시가 함께 기록된다.
        보낸 필드만 갱신되며, 갱신할 필드가 하나도 없으면 400 이다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserNo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_no:
                    type: integer
                    format: int64
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                nothing_to_update:
                  summary: 수정할 필드 없음
                  value:
                    code: BAD_REQUEST
                    message: 수정할 필드가 없습니다.
                password_rule:
                  summary: 비밀번호 작성규칙 위반
                  value:
                    code: BAD_REQUEST
                    message: 비밀번호에 연속된 문자열(1234, abcd 등)은 사용할 수 없습니다.
                    field: user_pw
                phone_format:
                  summary: 전화번호 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: "user_phone 은 하이픈 없이 숫자만 입력해야 합니다. (예: 01012345678)"
                    field: user_phone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenUserUpdate"
        "404":
          $ref: "#/components/responses/UserNotFound"

  # ---------------------------------------------------------------- 카메라
  /api/cctvs:
    get:
      tags: [cctvs]
      summary: 카메라 목록
      description: |
        페이징이 없다. 필터(`cctv_status`, `user_no`)를 주면 걸러진 목록이,
        아무것도 안 주면 전체가 `cctv_no` 오름차순으로 내려온다.
        ITS 카메라의 `cctv_stream_url` 은 토큰이 만료되므로 응답 직전에 최신 값으로
        갈아끼운다 (외부 API 가 죽어 있으면 저장된 주소가 그대로 나간다).
      security:
        - bearerAuth: []
      parameters:
        - name: cctv_status
          in: query
          schema:
            $ref: "#/components/schemas/CctvStatus"
        - name: user_no
          in: query
          description: |
            해당 사용자가 소유(담당)하는 카메라만 — 관리자 화면의 "이 사용자가 담당하는
            카메라" 목록에 쓴다. 값은 `Cctv.user_no` 와 같은 사용자 번호다.

            빼면 전체가 나온다. `cctv_status` 와 함께 주면 AND 로 걸린다
            (예: `?user_no=3&cctv_status=ACTIVE` → 3번 사용자의 ACTIVE 카메라만).
            담당 카메라가 없는 사용자는 404 가 아니라 `{"items": []}` 로 200 이다.
          schema:
            type: integer
            format: int64
            example: 3
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Cctv"
        "400":
          description: 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_int:
                  summary: 정수 파라미터 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: user_no 는 정수여야 합니다.
                    field: user_no
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [cctvs]
      summary: 카메라 등록 (ADMIN)
      description: 등록자(`user_no`)는 토큰의 주인으로 자동 지정되고, 상태는 `ACTIVE` 로 시작한다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CctvCreate"
      responses:
        "201":
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  cctv_no:
                    type: integer
                    format: int64
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                required:
                  summary: 필수값 누락
                  value:
                    code: BAD_REQUEST
                    message: cctv_name 는 필수입니다.
                    field: cctv_name
                not_number:
                  summary: 좌표가 숫자가 아님
                  value:
                    code: BAD_REQUEST
                    message: cctv_lat 는 숫자여야 합니다.
                    field: cctv_lat
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/cctvs/{cctv_no}:
    get:
      tags: [cctvs]
      summary: 카메라 단건
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CctvNo"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cctv"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CctvNotFound"
    put:
      tags: [cctvs]
      summary: 카메라 수정 · 중지 (ADMIN)
      description: '보낸 필드만 갱신된다. 감시를 멈추려면 `cctv_status: "INACTIVE"`.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CctvNo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CctvUpdate"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  cctv_no:
                    type: integer
                    format: int64
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: 수정할 필드가 없습니다.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CctvNotFound"

  # ---------------------------------------------------------------- ITS 공공 CCTV
  /api/its/cctvs:
    get:
      tags: [its]
      summary: 연동 가능한 ITS 공공 CCTV 목록
      description: |
        우리 DB 가 아니라 **ITS 오픈 API 를 그 자리에서 조회**해 돌려준다.
        카메라를 등록하려는 사용자가 "지금 붙일 수 있는 카메라"를 고르는 화면용이다.

        - **인증이 필요 없다.** 공개 개방 데이터를 중계하는 것이라 토큰 없이 부를 수 있다.
        - 좌표는 ITS 원본(`coordy`=위도, `coordx`=경도)을 우리 이름으로 정규화해 내려간다.
        - **바로 쓸 수 없는 항목은 빼고 준다** — 이름이 없거나, 스트림 주소가 없거나,
          좌표가 숫자로 읽히지 않는 항목은 목록에서 제외된다. 화면에서 고를 수 없는 것을
          보여줘 봐야 사용자가 눌렀을 때 실패할 뿐이다.
        - `total` 은 **페이지가 아니라 걸러낸 뒤의 전체 건수**다. `items` 는 그중 한 페이지다.

        실패하면 **503** 이다. `/api/cctvs` 는 ITS 가 죽어도 저장된 주소로 폴백해 200 을 내지만,
        여기는 폴백할 저장분이 없다. 빈 목록으로 위장하면 "카메라 없음"과 "서버 고장"을
        구분할 수 없다.
      parameters:
        - name: limit
          in: query
          description: 한 번에 받을 개수 (1~100). 벗어나면 400
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: 건너뛸 개수 (0 이상). 음수면 400
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: 조회 성공 (0건도 성공이다)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ItsCctv"
                  total:
                    type: integer
                    description: 걸러낸 뒤의 전체 건수 (items 는 그중 한 페이지)
                    example: 83
        "400":
          description: limit·offset 이 정수가 아니거나 허용 범위 밖 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: limit must be 1-100 and offset must be non-negative.
        "503":
          description: ITS 오픈 API 조회 실패 (`ITS_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: ITS_UNAVAILABLE
                message: ITS CCTV 목록을 조회할 수 없습니다.


  # ---------------------------------------------------------------- 이벤트
  /api/events:
    get:
      tags: [events]
      summary: 화재 이벤트 목록
      description: |
        최신순(`event_no` 내림차순). 카메라 이름·위치와 대표 이미지
        (`thumbnail_url`)를 함께 내려주므로 목록 화면에서 추가 호출이 필요 없다.

        시연·테스트로 만든 이벤트(`event_is_test`)는 기본으로 빠진다.
        보려면 `include_test=true`.
      security:
        - bearerAuth: []
      parameters:
        - name: event_status
          in: query
          schema:
            $ref: "#/components/schemas/EventStatus"
        - name: event_class
          in: query
          schema:
            $ref: "#/components/schemas/EventClass"
        - name: cctv_no
          in: query
          description: 특정 카메라의 이벤트만
          schema:
            type: integer
            format: int64
        - name: date_from
          in: query
          description: 검출 시각 시작 (해당일 포함)
          schema:
            type: string
            format: date
            example: "2026-08-01"
        - name: date_to
          in: query
          description: 검출 시각 종료 (해당일 포함)
          schema:
            type: string
            format: date
            example: "2026-08-10"
        - name: include_test
          in: query
          description: 테스트 이벤트 포함 여부
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/EventSummary"
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_int:
                  summary: 정수 파라미터 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: cctv_no 는 정수여야 합니다.
                    field: cctv_no
                bad_date:
                  summary: 날짜 파라미터 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: date_from 는 YYYY-MM-DD 형식이어야 합니다.
                    field: date_from
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/events/{event_no}:
    get:
      tags: [events]
      summary: 화재 이벤트 상세
      description: 카메라 정보 + 미디어(프레임·클립) + 알림 이력 + 119 신고 이력을 한 번에 준다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EventNo"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/EventNotFound"

  # ---------------------------------------------------------------- 알림
  /api/alerts:
    get:
      tags: [alerts]
      summary: 내 알림 목록
      description: |
        토큰 주인에게 온 알림만 나온다. 최신순(`alert_no` 내림차순).
        **주기적으로 다시 부르지 않는다** — 화면을 열 때와 응답 등 행동 직후에만 조회한다
        (2026-08-11 폴링 폐기).
      security:
        - bearerAuth: []
      parameters:
        - name: alert_status
          in: query
          schema:
            $ref: "#/components/schemas/AlertStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AlertSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/alerts/{alert_no}/respond:
    post:
      tags: [alerts]
      summary: 알림 응답 (화재 확인 / 오탐 취소)
      description: |
        - `READ` — 화재로 확인. 즉시 119 신고 절차가 시작된다.
        - `CANCEL` — 오탐으로 취소. `alert_deadline_at` 이전에만 가능하며,
          유예가 지났으면 409 (`DEADLINE_PASSED`) — 이미 신고 절차로 넘어갔기 때문이다.

        > ⚠️ **유예는 기본 30초다** (`ALERT_DEADLINE_SEC`, 실제로는 스윕 주기 때문에 30~35초).
        > Swagger UI 로 손수 눌러 보면 이벤트 확정 → `alert_no` 확인 → 여기까지 오는 사이에
        > 유예가 지나 `CANCEL` 이 409 로 떨어지기 쉽다. 취소 흐름을 확인할 때는
        > 로컬 `.env` 에 `ALERT_DEADLINE_SEC=300` 처럼 넉넉히 잡고 테스트할 것.

        응답은 **이벤트 단위**로 적용된다. 확정 시 PUSH·SMS 두 알림이 동시에 나가는데
        한쪽에 응답하면 같은 이벤트의 나머지 미응답 알림도 같은 상태·같은 시각으로 닫힌다.

        이미 무응답(`NO_RESPONSE`)으로 넘어간 알림에 뒤늦게 `READ` 를 보내면
        받아주긴 하지만 `alert_status` 는 `NO_RESPONSE` 로 남는다 —
        '무응답으로 신고까지 갔다'는 이력을 지우지 않기 위해서다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AlertNo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [READ, CANCEL]
      responses:
        "200":
          description: 응답 처리 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  alert_no:
                    type: integer
                    format: int64
                  alert_status:
                    $ref: "#/components/schemas/AlertStatus"
                  alert_responded_at:
                    type: string
                    format: date-time
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: action 은 READ 또는 CANCEL 이어야 합니다.
                field: action
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotYourAlert"
        "404":
          $ref: "#/components/responses/AlertNotFound"
        "409":
          $ref: "#/components/responses/AlertConflict"

  # ---------------------------------------------------------------- 소방서
  /api/agencies:
    get:
      tags: [agencies]
      summary: 소방서 목록
      description: 페이징 없이 전체를 내려준다. 승계 우선순위는 저장하지 않고 CCTV 좌표와의 거리로 매번 계산한다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agency"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [agencies]
      summary: 소방서 등록 (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyCreate"
      responses:
        "201":
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  agency_no:
                    type: integer
                    format: int64
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                required:
                  summary: 필수값 누락
                  value:
                    code: BAD_REQUEST
                    message: agency_name 는 필수입니다.
                    field: agency_name
                not_number:
                  summary: 좌표가 숫자가 아님
                  value:
                    code: BAD_REQUEST
                    message: agency_lat 는 숫자여야 합니다.
                    field: agency_lat
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/agencies/{agency_no}:
    put:
      tags: [agencies]
      summary: 소방서 수정 · 비활성화 (ADMIN)
      description: '보낸 필드만 갱신된다. 승계 대상에서 빼려면 `agency_is_active: false`.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyNo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyUpdate"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  agency_no:
                    type: integer
                    format: int64
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: 수정할 필드가 없습니다.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyNotFound"

  # ---------------------------------------------------------------- 신고
  /api/reports:
    get:
      tags: [reports]
      summary: 119 신고 이력
      description: |
        `event_no` 로 필터하면 그 화재 1건의 **승계 이력**이 통째로 나온다.
        `report_sequence` 는 기관을 몇 번째로 바꿨는지(바깥 루프),
        `report_attempt_count` 는 그 기관에 몇 번 쐈는지(안쪽 루프)다.
      security:
        - bearerAuth: []
      parameters:
        - name: report_status
          in: query
          schema:
            $ref: "#/components/schemas/ReportStatus"
        - name: event_no
          in: query
          description: 특정 이벤트의 승계 이력만
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Report"
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: event_no 는 정수여야 합니다.
                field: event_no
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/reports/{report_no}/logs:
    get:
      tags: [reports]
      summary: 119 송수신 로그
      description: |
        신고 1건이 실제로 무엇을 보내고 무엇을 받았는지 **전송 시도별로** 남긴 기록이다.
        `report_119` 는 결과 요약(상태·시도횟수·접수번호)만 갖고 있어서
        "몇 시에 뭘 보냈고 뭐라고 답이 왔길래 승계했나"를 따질 수 없었다.

        페이징하지 않는다 — 한 신고의 시도는 `MAX_REPORT_ATTEMPTS`(기본 4)건으로 묶인다.
        화재 1건의 전 구간을 보려면 `GET /api/reports?event_no=` 로 승계 이력을 받아
        각 `report_no` 의 로그를 이어 붙이면 된다.

        `log_result` 의 `TIMEOUT` 과 `ERROR` 는 뜻이 다르다. `TIMEOUT` 은 응답이
        안 왔을 뿐 **상대는 접수했을 수도 있다**(그래서 신고 ID 로 중복을 막는다).
        `ERROR` 는 연결 자체가 안 돼 전송되지 않은 것이다.
      security:
        - bearerAuth: []
      parameters:
        - name: report_no
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 조회 성공 (시도 순서대로)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReportLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ReportNotFound"

  # ---------------------------------------------------------------- 내부 (AI)
  /api/internal/cctvs:
    get:
      tags: [internal]
      summary: 감시 대상 카메라 목록 (AI 전용)
      description: |
        공개 목록과 같은 컬럼 + 최신 스트림 주소. 보통 `?cctv_status=ACTIVE` 로
        가동 중인 카메라만 받아 간다. ITS 스트림 주소의 토큰이 만료돼 재생이 끊기면
        이 엔드포인트를 다시 불러 새 주소로 재접속하면 된다.
      security:
        - internalKey: []
      parameters:
        - name: cctv_status
          in: query
          schema:
            $ref: "#/components/schemas/CctvStatus"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Cctv"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"

  /api/internal/detections:
    post:
      tags: [internal]
      summary: 검출 결과 수집 (AI 전용)
      description: |
        **프레임 1장** 단위로 보낸다. 백엔드가 프레임을 누적해 이벤트를 만들고,
        임계 프레임 수를 넘기면 이벤트를 `CONFIRMED` 로 확정하며 알림까지 발송한다.

        - `detections` 가 비었거나 화재 클래스가 없으면 이벤트를 만들지 않고
          `{ "event_no": null, "ignored": true }` 를 돌려준다.
        - 화재로 취급하는 클래스는 `flame`·`smoke` 뿐이다 (`person` 등은 판정에서 제외하되
          원본은 그대로 저장한다).
        - `captured_at` 을 생략하면 서버 수신 시각을 쓴다.
      security:
        - internalKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectionIngest"
      responses:
        "200":
          description: 수집 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionResult"
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_cctv_no:
                  summary: cctv_no 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: cctv_no 는 필수 정수입니다.
                    field: cctv_no
                bad_detections:
                  summary: detections 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: detections 는 리스트여야 합니다.
                    field: detections
                bad_captured_at:
                  summary: captured_at 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: captured_at 은 ISO 8601 형식이어야 합니다.
                    field: captured_at
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
        "404":
          $ref: "#/components/responses/CctvNotFound"

  # ---------------------------------------------------------------- 시스템
  /api/health:
    get:
      tags: [system]
      summary: 헬스체크
      description: 인증 없이 부를 수 있다. 서버가 떠 있는지만 본다.
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /media/{filename}:
    get:
      tags: [system]
      summary: 미디어 파일 서빙
      description: |
        검출 프레임(FRAME) 실제 파일. API 응답의 `media_url` /
        `thumbnail_url` 값이 곧 이 경로이므로 `<img src>` 에 그대로 넣으면 된다.

        **인증을 걸지 않는다** — 브라우저의 `<img>`/`<video>` 는 `Authorization`
        헤더를 붙일 수 없어 JWT 를 요구하면 화면에 아무것도 뜨지 않는다.
        (운영이라면 만료 시간이 든 서명 URL 또는 리버스 프록시 인증을 써야 한다.)

        저장 루트 바깥을 노리는 경로(`../`)는 404 로 막힌다.
      parameters:
        - name: filename
          in: path
          required: true
          description: 저장 루트 기준 상대 경로
          schema:
            type: string
          example: events/12/frame_001.jpg
      responses:
        "200":
          description: 파일 본문
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '로그인으로 받은 `access_token` 을 `Authorization: Bearer <token>` 으로 보낸다.'
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: AI 모델 전용. 서버의 `INTERNAL_API_KEY` 환경변수 값과 대조한다.

  parameters:
    Page:
      name: page
      in: query
      description: 페이지 번호 (1부터)
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      description: 페이지 크기 (최대 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserNo:
      name: user_no
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CctvNo:
      name: cctv_no
      in: path
      required: true
      schema:
        type: integer
        format: int64
    EventNo:
      name: event_no
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AlertNo:
      name: alert_no
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AgencyNo:
      name: agency_no
      in: path
      required: true
      schema:
        type: integer
        format: int64

  # 에러 응답은 반드시 example 을 단다 —
  # 없으면 Swagger UI 가 공통 Error 스키마로 본문을 만들어 내서 400·401·403 이
  # 전부 똑같이 보이고, 프론트가 분기할 code 를 화면에서 알아낼 수 없다.
  # (tests/test_openapi.py::test_error_responses_declare_example 가 강제한다)
  # 400 은 공통 응답을 두지 않는다 — 엔드포인트마다 실제로 나가는 문구와 field 가
  # 다르고, 공통 예시 하나를 돌려쓰면 카메라 등록 400 에 "user_id 는 필수입니다"
  # 같은 거짓 예시가 붙는다. 400 은 오퍼레이션 안에 직접 쓴다.
  responses:
    Unauthorized:
      description: |
        토큰 없음(`UNAUTHORIZED`) · 만료(`TOKEN_EXPIRED`) · 손상(`INVALID_TOKEN`).
        `TOKEN_EXPIRED` 면 로그인 화면으로 돌려보내야 한다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              summary: 토큰 없음
              value:
                code: UNAUTHORIZED
                message: 인증 토큰이 필요합니다.
            expired:
              summary: 토큰 만료
              value:
                code: TOKEN_EXPIRED
                message: 토큰이 만료되었습니다. 다시 로그인해주세요.
            invalid:
              summary: 토큰 손상
              value:
                code: INVALID_TOKEN
                message: 유효하지 않은 토큰입니다.

    Forbidden:
      description: 관리자 권한 필요 (`FORBIDDEN`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: FORBIDDEN
            message: 관리자 권한이 필요합니다.

    NotFound:
      description: 리소스 없음 (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: 리소스를 찾을 수 없습니다.

    InvalidCredentials:
      description: |
        아이디 또는 비밀번호 불일치 (`INVALID_CREDENTIALS`).
        존재하지 않는 아이디와 비밀번호 오류를 **구분하지 않는다** —
        구분하면 계정 존재 여부를 확인하는 통로가 된다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_CREDENTIALS
            message: 아이디 또는 비밀번호가 일치하지 않습니다.

    AccountBlocked:
      description: |
        정지·탈퇴 계정. 비밀번호가 맞아야 여기까지 온다 (틀리면 401 이 먼저 나간다).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            suspended:
              summary: 정지된 계정
              value:
                code: ACCOUNT_SUSPENDED
                message: 정지된 계정입니다.
            withdrawn:
              summary: 탈퇴한 계정
              value:
                code: ACCOUNT_WITHDRAWN
                message: 탈퇴한 계정입니다.

    ForbiddenUserUpdate:
      description: |
        남의 계정을 수정하려 했거나(`FORBIDDEN`), 일반 사용자가 관리자 전용 필드
        (`user_role`·`user_status`)를 건드리려 한 경우. 후자는 요청 전체가 거부된다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            not_mine:
              summary: 남의 계정
              value:
                code: FORBIDDEN
                message: 본인 계정만 수정할 수 있습니다.
            admin_only_field:
              summary: 관리자 전용 필드
              value:
                code: FORBIDDEN
                message: 권한 등급과 계정 상태는 관리자만 변경할 수 있습니다.

    DuplicateUserId:
      description: 이미 사용 중인 아이디 (`DUPLICATE_USER_ID`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: DUPLICATE_USER_ID
            message: 이미 사용 중인 아이디입니다.

    UserNotFound:
      description: 사용자 없음 (`USER_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: USER_NOT_FOUND
            message: 사용자를 찾을 수 없습니다.

    CctvNotFound:
      description: 카메라 없음 (`CCTV_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: CCTV_NOT_FOUND
            message: 카메라를 찾을 수 없습니다.

    EventNotFound:
      description: 이벤트 없음 (`EVENT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: EVENT_NOT_FOUND
            message: 이벤트를 찾을 수 없습니다.

    AlertNotFound:
      description: 알림 없음 (`ALERT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: ALERT_NOT_FOUND
            message: 알림을 찾을 수 없습니다.

    NotYourAlert:
      description: 다른 사용자의 알림 (`NOT_YOUR_ALERT`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_YOUR_ALERT
            message: 다른 사용자의 알림입니다.

    AlertConflict:
      description: |
        이미 응답했거나(`ALREADY_RESPONDED`), 취소 유예가 지난(`DEADLINE_PASSED`) 알림.
        `DEADLINE_PASSED` 는 이미 119 신고 절차로 넘어갔다는 뜻이라 되돌릴 수 없다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            already_responded:
              summary: 이미 응답함
              value:
                code: ALREADY_RESPONDED
                message: 이미 응답한 알림입니다.
            deadline_passed:
              summary: 취소 유예 경과
              value:
                code: DEADLINE_PASSED
                message: 취소 유예 시간이 지났습니다.

    AgencyNotFound:
      description: 소방서 없음 (`AGENCY_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: AGENCY_NOT_FOUND
            message: 소방서를 찾을 수 없습니다.

    ReportNotFound:
      description: 신고 없음 (`REPORT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: REPORT_NOT_FOUND
            message: 신고를 찾을 수 없습니다.

    InternalUnauthorized:
      description: 내부 API 키 불일치 (`INTERNAL_UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INTERNAL_UNAUTHORIZED
            message: 내부 API 키가 올바르지 않습니다.

  schemas:

    # ---------- 공통 ----------
    Error:
      type: object
      description: |
        모든 에러 응답의 공통 형식.

        `field` 는 검증 실패(400)에서 **어느 입력 때문인지** 가리킬 수 있을 때만
        실린다. 400 은 `code` 가 전부 `BAD_REQUEST` 하나라, 이게 없으면 프론트가
        폼의 어느 칸에 메시지를 붙일지 정하려고 한글 문구를 파싱해야 한다.
        입력 하나를 특정할 수 없는 400(예: "수정할 필드가 없습니다")과
        400 이 아닌 에러에는 키 자체가 없다.
      required: [code, message]
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          description: 사용자에게 그대로 보여줄 수 있는 한글 메시지
          example: user_id 는 필수입니다.
        field:
          type: string
          description: 문제가 된 요청 필드·쿼리 파라미터 이름 (없을 수 있음)
          example: user_id

    PageMeta:
      type: object
      description: 페이징 목록 봉투. `total_count` 가 0 이면 `total_pages` 도 0 이다.
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        total_count:
          type: integer
          example: 137
        total_pages:
          type: integer
          example: 7

    # ---------- enum ----------
    UserRole:
      type: string
      enum: [ADMIN, VIEWER]
    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, WITHDRAWN]
    CctvStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    EventStatus:
      type: string
      description: |
        `PENDING` 관측 창에서 누적 중 · `CONFIRMED` 화재 확정 ·
        `DISMISSED` 오탐 취소 또는 창 안에서 임계 프레임 수를 못 채워 기준미달
      enum: [PENDING, CONFIRMED, DISMISSED]
    EventClass:
      type: string
      description: 불꽃·연기가 함께 잡히면 `FLAME_SMOKE`
      enum: [FLAME, SMOKE, FLAME_SMOKE]
    AlertChannel:
      type: string
      description: 확정 시 두 채널이 동시에 나간다 (PUSH = 인앱 알림 목록에 남는 행, SMS = 실제 발송)
      enum: [PUSH, SMS]
    AlertStatus:
      type: string
      description: |
        `SENT` 발송됨 · `READ` 화재 확인 · `CANCELED` 오탐 취소 ·
        `NO_RESPONSE` 유예 내 무응답(119 신고로 넘어감)
      enum: [SENT, READ, CANCELED, NO_RESPONSE]
    ReportLog:
      type: object
      description: 119 로 전송한 시도 1회의 기록 (`GET /api/reports/{report_no}/logs`)
      properties:
        log_no:
          type: integer
          format: int64
        report_no:
          type: integer
          format: int64
        log_attempt:
          type: integer
          description: 그 기관에 몇 번째로 쐈나 (1부터)
          example: 1
        log_endpoint:
          type: string
          description: 실제로 전송한 기관 주소
          example: http://localhost:6000/report?mode=ok
        log_request:
          type: object
          additionalProperties: true
          description: 보낸 신고 본문 그대로
        log_result:
          $ref: "#/components/schemas/ReportLogResult"
        log_http_status:
          type: integer
          nullable: true
          description: 응답 HTTP 상태코드. 응답이 없었으면 `null`
          example: 200
        log_response:
          type: object
          additionalProperties: true
          nullable: true
          description: 받은 응답 본문. 본문이 없거나 JSON 이 아니면 `null`
        log_error:
          type: string
          nullable: true
          description: 전송 실패 사유 (타임아웃·연결실패). 응답을 받았으면 `null`
        log_elapsed_ms:
          type: integer
          description: 요청부터 응답(또는 실패)까지 걸린 시간(ms)
          example: 42
        log_sent_at:
          type: string
          format: date-time

    ReportLogResult:
      type: string
      description: |
        `ACCEPTED` 2xx 접수 확인 · `REJECTED` 2xx 아닌 응답 ·
        `TIMEOUT` 응답 없음 · `ERROR` 연결 실패 등 전송 자체가 안 됨

        `TIMEOUT` 은 **상대가 접수했을 수도 있다**는 뜻이다. 그래서 재전송에
        같은 신고 ID(`report_uid`)를 실어 중복 접수를 막는다.
      enum: [ACCEPTED, REJECTED, TIMEOUT, ERROR]

    ReportStatus:
      type: string
      description: |
        `SENDING` 전송 중 · `ACCEPTED` 119 서버가 신고를 받았다고 응답 ·
        `NO_RESPONSE` 무응답이라 다음 기관으로 승계 · `FAILED` 모든 기관 소진

        `ACCEPTED` 는 **접수 확인까지**를 뜻한다. 2xx 응답은 "신고를 받았다"이지
        "소방차가 배차됐다"가 아니다. 출동 배차 확인은 119 가 별도 콜백으로
        회신하는 값이고, 실제 연동 전까지는 구현하지 않는다 —
        화면에 '출동'으로 표기하지 말 것.
      enum: [SENDING, ACCEPTED, NO_RESPONSE, FAILED]

    # ---------- 계정 ----------
    LoginUser:
      type: object
      description: 로그인 직후 화면에 바로 필요한 최소 정보
      properties:
        user_no:
          type: integer
          format: int64
        user_id:
          type: string
        user_name:
          type: string
          nullable: true
        user_role:
          $ref: "#/components/schemas/UserRole"

    Me:
      type: object
      properties:
        user_no:
          type: integer
          format: int64
        user_id:
          type: string
        user_name:
          type: string
          nullable: true
        user_email:
          type: string
          nullable: true
        user_phone:
          type: string
          nullable: true
          description: 하이픈 없이 숫자만
        user_role:
          $ref: "#/components/schemas/UserRole"
        user_status:
          $ref: "#/components/schemas/UserStatus"

    UserSummary:
      type: object
      properties:
        user_no:
          type: integer
          format: int64
        user_id:
          type: string
        user_name:
          type: string
          nullable: true
        user_email:
          type: string
          nullable: true
        user_phone:
          type: string
          nullable: true
        user_role:
          $ref: "#/components/schemas/UserRole"
        user_status:
          $ref: "#/components/schemas/UserStatus"
        user_created_at:
          type: string
          format: date-time
          nullable: true

    UserCreate:
      type: object
      required: [user_id, user_pw, user_name, user_role]
      properties:
        user_id:
          type: string
          pattern: "^[a-z][a-z0-9_-]{4,19}$"
          example: user02
        user_pw:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: "Fire#123"
        user_name:
          type: string
          example: 홍길동
        user_role:
          $ref: "#/components/schemas/UserRole"
        user_email:
          type: string
          nullable: true
        user_phone:
          type: string
          nullable: true
          pattern: "^01[016789][0-9]{7,8}$"
          example: "01012345678"
        user_gender:
          type: string
          nullable: true
        user_address:
          type: string
          nullable: true

    UserUpdate:
      type: object
      description: 보낸 필드만 갱신된다. 하나도 없으면 400.
      properties:
        user_name:
          type: string
        user_email:
          type: string
          nullable: true
        user_phone:
          type: string
          nullable: true
          description: 지우려면 `null` 을 보낸다 (빈 문자열은 형식 오류)
          pattern: "^01[016789][0-9]{7,8}$"
        user_pw:
          type: string
          format: password
        user_gender:
          type: string
          nullable: true
        user_address:
          type: string
          nullable: true
        user_role:
          allOf:
            - $ref: "#/components/schemas/UserRole"
          description: ADMIN 만 변경 가능
        user_status:
          allOf:
            - $ref: "#/components/schemas/UserStatus"
          description: ADMIN 만 변경 가능. `WITHDRAWN` 이면 탈퇴 일시가 함께 기록된다

    # ---------- 카메라 ----------
    ItsCctv:
      type: object
      description: |
        ITS 오픈 API 항목을 우리 스키마 이름으로 정규화한 것. **DB 행이 아니다** —
        `cctv_no` 가 없고, 등록하려면 이 값들로 `POST /api/cctvs` 를 부르면 된다.
        이름·스트림 주소·좌표가 온전한 항목만 목록에 실리므로 이 필드들은 null 이 아니다.
      properties:
        cctv_name:
          type: string
          description: ITS `cctvname`. 노선+지점 표기다
          example: "[경부선] 양재IC"
        cctv_location:
          type: string
          description: ITS `roadsectionid` — 없으면 이름을 그대로 넣는다
          example: "[경부선] 양재IC"
        cctv_type:
          type: string
          description: 스트림 형식 (ITS `cctvformat`). 값이 없으면 `ITS`
          example: HLS
        cctv_lat:
          type: number
          format: double
          description: ITS `coordy` (**위도**)
          example: 37.472145
        cctv_lng:
          type: number
          format: double
          description: ITS `coordx` (**경도**)
          example: 127.042125
        cctv_stream_url:
          type: string
          description: HLS 주소. 시간 제한 토큰이 박혀 있어 오래 두면 만료된다

    Cctv:
      type: object
      properties:
        cctv_no:
          type: integer
          format: int64
        user_no:
          type: integer
          format: int64
          description: 등록한 관리자
        cctv_name:
          type: string
          nullable: true
        cctv_location:
          type: string
          nullable: true
        cctv_lat:
          type: number
          format: double
          nullable: true
          example: 37.5665
        cctv_lng:
          type: number
          format: double
          nullable: true
          example: 126.9780
        cctv_stream_url:
          type: string
          nullable: true
          description: ITS 카메라면 응답 시점의 최신 주소로 갈아끼워 나간다
        cctv_width:
          type: integer
          nullable: true
        cctv_height:
          type: integer
          nullable: true
        cctv_status:
          $ref: "#/components/schemas/CctvStatus"
        cctv_created_at:
          type: string
          format: date-time
          nullable: true

    CctvCreate:
      type: object
      required: [cctv_name, cctv_location, cctv_lat, cctv_lng, cctv_stream_url]
      properties:
        cctv_name:
          type: string
        cctv_location:
          type: string
        cctv_lat:
          type: number
          format: double
          description: 숫자로 보낸다 ("37.5" 같은 문자열은 400)
        cctv_lng:
          type: number
          format: double
        cctv_stream_url:
          type: string
        cctv_width:
          type: integer
          nullable: true
        cctv_height:
          type: integer
          nullable: true

    CctvUpdate:
      type: object
      description: 보낸 필드만 갱신된다. 하나도 없으면 400.
      properties:
        cctv_name:
          type: string
        cctv_location:
          type: string
        cctv_lat:
          type: number
          format: double
        cctv_lng:
          type: number
          format: double
        cctv_stream_url:
          type: string
        cctv_width:
          type: integer
        cctv_height:
          type: integer
        cctv_status:
          $ref: "#/components/schemas/CctvStatus"

    # ---------- 이벤트 ----------
    EventSummary:
      type: object
      properties:
        event_no:
          type: integer
          format: int64
        cctv_no:
          type: integer
          format: int64
        cctv_name:
          type: string
          nullable: true
        cctv_location:
          type: string
          nullable: true
        event_status:
          $ref: "#/components/schemas/EventStatus"
        event_class:
          $ref: "#/components/schemas/EventClass"
        event_first_detected_at:
          type: string
          format: date-time
          nullable: true
          description: 첫 프레임이 잡힌 시각
        event_detected_at:
          type: string
          format: date-time
          nullable: true
          description: 화재로 확정된 시각 (PENDING 이면 null)
        event_confidence:
          type: number
          format: double
          nullable: true
          example: 0.9231
        event_is_test:
          type: boolean
        thumbnail_url:
          type: string
          nullable: true
          description: 대표 이미지 경로 (`<img src>` 에 그대로 사용)
          example: /media/events/12/frame_001.jpg

    EventDetail:
      type: object
      properties:
        event_no:
          type: integer
          format: int64
        event_status:
          $ref: "#/components/schemas/EventStatus"
        event_class:
          $ref: "#/components/schemas/EventClass"
        event_first_detected_at:
          type: string
          format: date-time
          nullable: true
        event_detected_at:
          type: string
          format: date-time
          nullable: true
        event_detected_frames:
          type: integer
          nullable: true
          description: 지금까지 누적된 화재 프레임 수
        event_threshold_frames:
          type: integer
          nullable: true
          description: 확정에 필요한 프레임 수
        event_confidence:
          type: number
          format: double
          nullable: true
        event_is_test:
          type: boolean
        cctv:
          $ref: "#/components/schemas/EventCctv"
        media:
          type: array
          items:
            $ref: "#/components/schemas/Media"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        reports:
          type: array
          description: 승계 순서대로 쌓인 119 신고 이력
          items:
            $ref: "#/components/schemas/EventReport"

    EventCctv:
      type: object
      description: 상세 화면용 카메라 요약 (지도 표시에 좌표가 필요하다)
      properties:
        cctv_no:
          type: integer
          format: int64
        cctv_name:
          type: string
          nullable: true
        cctv_location:
          type: string
          nullable: true
        cctv_lat:
          type: number
          format: double
          nullable: true
        cctv_lng:
          type: number
          format: double
          nullable: true

    Media:
      type: object
      description: 대표 이미지(`media_is_primary`)가 먼저 나온다
      properties:
        media_no:
          type: integer
          format: int64
        media_url:
          type: string
          nullable: true
          example: /media/events/12/frame_001.jpg
        media_confidence:
          type: number
          format: double
          nullable: true
        media_captured_at:
          type: string
          format: date-time
          nullable: true
        media_is_primary:
          type: boolean
        media_detections:
          type: array
          nullable: true
          description: AI 가 보낸 원본 검출 배열 (화재 외 클래스도 그대로 보관)
          items:
            $ref: "#/components/schemas/Detection"

    # ---------- 알림 ----------
    Alert:
      type: object
      description: 이벤트 상세에 붙는 알림 이력
      properties:
        alert_no:
          type: integer
          format: int64
        user_no:
          type: integer
          format: int64
        user_name:
          type: string
          nullable: true
        alert_channel:
          $ref: "#/components/schemas/AlertChannel"
        alert_status:
          $ref: "#/components/schemas/AlertStatus"
        alert_sent_at:
          type: string
          format: date-time
          nullable: true
        alert_deadline_at:
          type: string
          format: date-time
          nullable: true
          description: 이 시각까지 응답이 없으면 119 신고로 넘어간다
        alert_responded_at:
          type: string
          format: date-time
          nullable: true

    AlertSummary:
      type: object
      description: 내 알림 목록용 — 어떤 화재인지 바로 보이도록 이벤트·카메라 정보를 얹었다
      properties:
        alert_no:
          type: integer
          format: int64
        event_no:
          type: integer
          format: int64
        event_class:
          $ref: "#/components/schemas/EventClass"
        cctv_name:
          type: string
          nullable: true
        alert_channel:
          $ref: "#/components/schemas/AlertChannel"
        alert_status:
          $ref: "#/components/schemas/AlertStatus"
        alert_sent_at:
          type: string
          format: date-time
          nullable: true
        alert_deadline_at:
          type: string
          format: date-time
          nullable: true
        alert_responded_at:
          type: string
          format: date-time
          nullable: true

    # ---------- 소방서 ----------
    Agency:
      type: object
      properties:
        agency_no:
          type: integer
          format: int64
        agency_name:
          type: string
          nullable: true
        agency_lat:
          type: number
          format: double
          nullable: true
        agency_lng:
          type: number
          format: double
          nullable: true
        agency_endpoint:
          type: string
          nullable: true
          description: 신고를 쏘는 주소 (시연에서는 가상 119 서버)
          example: http://localhost:6000/report
        agency_is_active:
          type: boolean

    AgencyCreate:
      type: object
      required: [agency_name, agency_lat, agency_lng, agency_endpoint]
      properties:
        agency_name:
          type: string
        agency_lat:
          type: number
          format: double
        agency_lng:
          type: number
          format: double
        agency_endpoint:
          type: string

    AgencyUpdate:
      type: object
      description: 보낸 필드만 갱신된다. 하나도 없으면 400.
      properties:
        agency_name:
          type: string
        agency_lat:
          type: number
          format: double
        agency_lng:
          type: number
          format: double
        agency_endpoint:
          type: string
        agency_is_active:
          type: boolean

    # ---------- 신고 ----------
    Report:
      type: object
      properties:
        report_no:
          type: integer
          format: int64
        event_no:
          type: integer
          format: int64
        agency_no:
          type: integer
          format: int64
        agency_name:
          type: string
          nullable: true
        report_sequence:
          type: integer
          nullable: true
          description: 기관을 몇 번째로 바꿨나 (승계 순서)
        report_external_id:
          type: string
          nullable: true
          description: 소방서가 돌려준 접수번호
        report_trigger_reason:
          type: string
          nullable: true
          description: 신고를 시작한 이유
          example: NO_RESPONSE_TIMEOUT
        report_status:
          $ref: "#/components/schemas/ReportStatus"
        report_address:
          type: string
          nullable: true
        report_distance_km:
          type: number
          format: double
          nullable: true
          description: CCTV 좌표에서 그 소방서까지의 거리
        report_attempt_count:
          type: integer
          nullable: true
          description: 그 기관에 몇 번 쐈나 (최대 4)
        reported_at:
          type: string
          format: date-time
          nullable: true
        report_accepted_at:
          type: string
          format: date-time
          nullable: true

    EventReport:
      type: object
      description: 이벤트 상세에 붙는 신고 이력 (목록용 Report 의 축약본)
      properties:
        report_no:
          type: integer
          format: int64
        agency_no:
          type: integer
          format: int64
        agency_name:
          type: string
          nullable: true
        report_sequence:
          type: integer
          nullable: true
        report_status:
          $ref: "#/components/schemas/ReportStatus"
        report_distance_km:
          type: number
          format: double
          nullable: true
        reported_at:
          type: string
          format: date-time
          nullable: true
        report_accepted_at:
          type: string
          format: date-time
          nullable: true

    # ---------- 내부 (AI) ----------
    Detection:
      type: object
      description: 프레임 1장에서 잡힌 박스 1개
      properties:
        cls:
          type: string
          description: 화재로 취급하는 값은 `flame`·`smoke` 뿐 (그 외는 판정에서 제외)
          example: flame
        conf:
          type: number
          format: double
          example: 0.87
        bbox:
          type: array
          description: "[x1, y1, x2, y2] 픽셀 좌표"
          items:
            type: number
          minItems: 4
          maxItems: 4

    DetectionIngest:
      type: object
      required: [cctv_no, detections]
      properties:
        cctv_no:
          type: integer
          format: int64
        captured_at:
          type: string
          format: date-time
          nullable: true
          description: 생략하면 서버 수신 시각을 쓴다 (ISO 8601)
        media_url:
          type: string
          nullable: true
          description: 저장된 프레임 이미지 경로
          example: /media/events/12/frame_001.jpg
        detections:
          type: array
          description: 빈 배열이면 무시된다 (이벤트를 만들지 않는다)
          items:
            $ref: "#/components/schemas/Detection"

    DetectionResult:
      type: object
      description: |
        화재 클래스가 없으면 `{ "event_no": null, "ignored": true }`,
        있으면 누적 상태를 돌려준다.
      properties:
        event_no:
          type: integer
          format: int64
          nullable: true
        ignored:
          type: boolean
          description: 화재 클래스가 없어 무시된 프레임일 때만 `true`
        event_status:
          $ref: "#/components/schemas/EventStatus"
        event_detected_frames:
          type: integer
          description: 지금까지 누적된 화재 프레임 수
        event_threshold_frames:
          type: integer
          description: 확정에 필요한 프레임 수
