# 파이어가드 API 스펙 (OpenAPI 3.0)
#
# 이 파일이 프론트에 나가는 계약서다. 손으로 관리하며, 라우트를 고치고 여기를
# 안 고치면 tests/test_openapi.py 가 빨간불로 잡는다 (경로·메서드·인증 대조).
#
# 서빙:  GET /api/docs/        Swagger UI
#        GET /api/openapi.yaml 원본 (TS 타입 생성기 입력)
openapi: 3.0.3

info:
  title: 파이어가드 API
  version: 0.10.0
  description: |
    CCTV 화재 감지 → 관리자 알림 → 무응답 시 119 자동 신고·승계 백엔드 API.

    ## 공통 규칙
    - 모든 필드는 `snake_case`, 날짜·시각은 ISO 8601 (`2026-08-10T14:30:00`)
    - 인증은 `Authorization: Bearer <access_token>` (로그인·헬스체크·미디어 제외)
    - AI 모델 전용 `/api/internal/*` 은 JWT 대신 `X-Internal-Key` 헤더를 쓴다
    - 에러는 어떤 상황에서도 `{ "code": "...", "message": "..." }` 형태다.
      검증 실패(400)는 어느 입력 탓인지 가리킬 수 있으면 `field` 가 하나 더 붙는다
      (`{ "code": "BAD_REQUEST", "message": "...", "field": "user_pw" }`) —
      400 은 `code` 가 전부 `BAD_REQUEST` 라, 폼 입력칸에 메시지를 붙일 때 이걸 쓴다
      ⚠️ 예외 셋 — 가입 화면 보조 경로는 본문 모양이 다르다: `GET /api/auth/check-id` 와
      `POST /api/email/verify-confirm` 은 `{ "detail": "..." }`, `POST /api/auth/verify-code` 는
      `{ "error": "..." }` 로 400 을 낸다 (각 항목 참고)
    - 목록 중 페이징이 있는 것은 `items / page / size / total_count / total_pages`
      봉투로 감싸 내려간다 (`/api/cctvs`, `/api/agencies` 는 페이징 없이 `items` 만)

    ## 실시간 알림 — 폴링하지 않는다 (2026-08-11 확정)
    WebSocket·SSE 뿐 아니라 **폴링도 쓰지 않는다**. 119 신고가 화재확인(`POST /api/alerts/{alert_no}/respond`)
    요청 안에서 **동기로** 끝나므로, 기다렸다가 알려줄 상태 변화가 없다.
    - 사람을 깨우는 채널은 **SMS** 다. 문자를 보고 앱을 열면 그때 목록을 한 번 조회하면 된다.
    - 남은 시간 카운트다운은 응답에 실린 `alert_deadline_at` 으로 클라이언트가 로컬 계산한다.
    - 화면 갱신 원칙: **열 때 조회 + 행동 후 갱신**.

    ## 판정·유예 기본값 (2026-08-10 변경)
    | 값 | 기본 | 뜻 |
    |---|---|---|
    | `EVENT_WINDOW_SEC` | 60초 | 관측 창. **최초 감지 시각에 고정**되며 이후 검출로 연장되지 않는다 |
    | `EVENT_THRESHOLD_FRAMES` | 30 | 창 안에서 이만큼 쌓이면 화재 확정. 미달인 채 창이 닫히면 `DISMISSED` |
    | `ALERT_DEADLINE_SEC` | 30초 | 알림 응답 유예. **이전 `ALERT_DEADLINE_MIN`(3분)에서 바뀐 값** |
    | `ESCALATION_INTERVAL_SEC` | 5초 | 무응답 스윕 주기. 신고가 최대 이만큼 늦어져 실제 유예는 30~35초 |

    Swagger UI 로 취소(`CANCEL`) 흐름을 손수 확인할 때는 30초가 짧아 409 가 나기 쉽다.
    로컬 `.env` 에서 `ALERT_DEADLINE_SEC` 를 넉넉히 올리고 테스트할 것.

servers:
  - url: http://localhost:5000
    description: 로컬 개발 서버

tags:
  - name: auth
    description: 인증 (로그인·세션 복원)
  - name: users
    description: 관리자 계정
  - name: me
    description: 내 정보 — 토큰 주인의 것만 다룬다 (user_no 를 URL 로 받지 않는다)
  - name: cctvs
    description: 연동 카메라
  - name: its
    description: ITS(국가교통정보센터) 공공 CCTV 조회 — 등록할 카메라 고르기
  - name: events
    description: 화재 이벤트
  - name: alerts
    description: 관리자 알림
  - name: agencies
    description: 소방서
  - name: reports
    description: 119 신고 이력
  - name: internal
    description: AI 모델 전용 내부 API
  - name: system
    description: 헬스체크·미디어 서빙

paths:

# ---------------------------------------------------------------- 관리자 권한 승인
  /api/admin/request-upgrade:
    post:
      tags:
        - users
      summary: 관리자 권한 승인 요청
      description: |
        일반 회원이 관리자 권한 승인을 요청한다. 계정 상태가 `ACTIVE` 에서 `PENDING` (승인 대기)으로 변경된다.
        권한(`user_role`)은 `VIEWER` 그대로이고, `PENDING` 인 동안에도 로그인·계정 찾기는 정상 동작한다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 요청 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 관리자 권한 승인 요청이 완료되었습니다.
        "400":
          description: 이미 관리자이거나 대기 중인 경우 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                already_admin:
                  summary: 이미 관리자 계정
                  value:
                    code: ALREADY_ADMIN
                    message: 이미 관리자 계정입니다.
                already_pending:
                  summary: 이미 승인 대기 중인 계정
                  value:
                    code: ALREADY_PENDING
                    message: 이미 승인 대기 중인 계정입니다.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/admin/handle-request/{target_user_no}:
    patch:
      tags:
        - users
      summary: 관리자 권한 승인/거절 처리 (ADMIN)
      description: |
        관리자가 승인 대기(`PENDING`) 중인 유저의 요청을 처리한다.
        - `action: "approve"` 면 `ADMIN` 으로 승격시킨다.
        - `action: "reject"` 면 다시 `USER` 로 원복한다.
      security:
        - bearerAuth: []
      parameters:
        - name: target_user_no
          in: path
          required: true
          description: 처리할 대상 유저 번호
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                  example: approve
      responses:
        "200":
          description: 처리 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: admin01 님의 관리자 승인이 완료되었습니다.
        "400":
          description: 대기 중이 아니거나 잘못된 액션 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_pending:
                  summary: 대기 중인 유저가 아님
                  value:
                    code: NOT_PENDING
                    message: 승인 대기 중인 유저가 아닙니다.
                invalid_action:
                  summary: 잘못된 액션 값
                  value:
                    code: INVALID_ACTION
                    message: 올바르지 않은 액션입니다. ('approve' 또는 'reject' 입력 필요)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
  # ---------------------------------------------------------------- 인증
  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: |
        아이디·비밀번호로 JWT 를 발급받는다. 정지(SUSPENDED)·탈퇴(WITHDRAWN)
        계정은 비밀번호가 맞아도 403 이다.
        로그인에는 비밀번호 작성규칙을 적용하지 않는다 (기존 계정 보장).

        소셜 로그인으로 가입한 계정은 비밀번호가 없어서 이 경로로는 절대 들어올 수
        없다 — 400 `SOCIAL_ACCOUNT` 로 돌려보낸다. 어느 서비스로 가입했는지까지는
        알려주지 않으니, 프론트는 소셜 로그인 버튼들을 다시 보여주면 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, user_pw]
              properties:
                user_id:
                  type: string
                  example: admin01
                user_pw:
                  type: string
                  format: password
                  example: "Fire#123"
      responses:
        "200":
          description: 발급 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: Bearer 토큰
                  user:
                    $ref: "#/components/schemas/LoginUser"
        "400":
          description: 필수값 누락·형식 오류(`BAD_REQUEST`) 또는 소셜 계정(`SOCIAL_ACCOUNT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing_field:
                  summary: 필수값 누락
                  value:
                    code: BAD_REQUEST
                    message: user_id 는 필수입니다.
                    field: user_id
                social:
                  summary: 소셜 로그인 계정
                  value:
                    code: SOCIAL_ACCOUNT
                    message: 소셜 로그인으로 가입한 계정입니다. 해당 서비스로 로그인해주세요.
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/AccountBlocked"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃 (토큰 폐기 + 이력 기록)
      description: |
        **토큰을 폐기하고** 활동이력에 `LOGOUT` 을 1행 남긴다. 두 가지를 다 한다.

        폐기는 사용자 단위다 — **그 사람의 다른 기기도 함께 끊긴다.** 이후 기존
        토큰으로 보낸 요청은 401 `TOKEN_REVOKED` 를 받는다. 로그아웃 직후 바로
        다시 로그인하는 것은 정상 동작한다.

        이 엔드포인트를 불러야만 둘 다 일어난다. 프론트가 저장한 토큰만 지우고
        이걸 건너뛰면 서버 쪽 토큰은 만료(기본 12시간)까지 살아있고 `LOGOUT` 행도
        쌓이지 않는다. 브라우저를 그냥 닫은 경우도 마찬가지로 잡히지 않는다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 폐기·기록 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: 로그아웃되었습니다.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [auth]
      summary: 내 정보
      description: 새로고침 후 세션 복원용. 토큰의 주인 정보를 DB 에서 다시 읽어 준다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/auth/find-id:
    post:
      tags: [auth]
      summary: 아이디 찾기
      description: |
        이름 + 이메일이 일치하면 아이디를 **부분 마스킹**해 돌려준다 (`admin01` → `adm****`).

        통째로 주지 않는 이유: 이름과 이메일은 팀 안에서 대개 알려진 정보라,
        전체를 돌려주면 그 조합을 아는 사람에게 계정 목록을 넘기는 셈이 된다.
        본인이라면 앞 3자로 알아본다.

        **탈퇴·정지 계정은 찾아지지 않는다** (404). 되찾아도 로그인이 막혀 있고,
        비활성 계정의 존재를 확인해 주는 것 자체가 불필요한 노출이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name, user_email]
              properties:
                user_name:
                  type: string
                  example: 관리자
                user_email:
                  type: string
                  format: email
                  example: admin@fg.kr
      responses:
        "200":
          description: 일치하는 계정을 찾음
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    description: 앞 3자만 남기고 마스킹된 아이디
                    example: adm****
        "400":
          description: 필수값 누락 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: user_email 는 필수입니다.
                field: user_email
        "404":
          description: 일치하는 계정 없음 (`USER_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: USER_NOT_FOUND
                message: 일치하는 계정을 찾을 수 없습니다.

  /api/auth/password-reset/request:
    post:
      tags: [auth]
      summary: 비밀번호 재설정 — 인증코드 발급
      description: |
        아이디 + 이름 + 이메일이 일치하면 인증코드를 만들어 **등록된 연락처로 SMS 발송**한다.
        받은 코드로 `/api/auth/password-reset/confirm` 을 부르면 비밀번호가 바뀐다.

        ⚠️ **정보가 틀려도 200 이 나간다.** 404 를 내면 조합을 바꿔가며 찔러 실재 계정을
        골라낼 수 있어서다. 응답만으로는 계정 존재 여부를 알 수 없다 — 프론트는
        "정보가 일치하면 문자를 보냈다"는 안내만 띄우고 다음 단계로 넘기면 된다.

        ⚠️ **코드는 응답 본문에 실리지 않는다.** 넣으면 인증 단계가 무의미해진다.
        개발 중에는 목(mock) SMS 발송기가 서버 로그에 찍으므로 그것으로 확인하면 된다.

        코드는 서버에 저장되지 않고 매 요청마다 계산해 대조한다. 그래서
        **비밀번호가 바뀌는 순간 이전 코드는 자동으로 무효**가 된다 (1회용).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, user_name, user_email]
              properties:
                user_id:
                  type: string
                  example: admin01
                user_name:
                  type: string
                  example: 관리자
                user_email:
                  type: string
                  format: email
                  example: admin@fg.kr
      responses:
        "200":
          description: 접수됨 (정보 일치 여부와 무관하게 같은 응답이다)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 정보가 일치하면 등록된 연락처로 인증코드를 보냈습니다.
                  expires_in_sec:
                    type: integer
                    description: 코드 유효시간(초). 발급 시점에 따라 최대 30초 짧아질 수 있다
                    example: 300
        "400":
          description: 필수값 누락 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: user_email 는 필수입니다.
                field: user_email

  /api/auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: 비밀번호 재설정 — 인증코드 확인 후 변경
      description: |
        인증코드가 맞으면 새 비밀번호로 바꾼다. 성공하면 새 비밀번호로 바로 로그인하면 된다.

        - 코드는 **대소문자·공백을 가리지 않는다**. 문자로 받은 값을 소문자로 치거나
          중간에 공백을 넣어도 통과한다 (`ABCDE FGHJK` = `abcdefghjk`).
        - 비밀번호 작성규칙은 **가입할 때와 똑같이** 적용된다. 재설정으로 규칙을
          우회할 수 있으면 규칙을 둔 의미가 없다.
        - 코드가 틀렸을 때와 아이디가 없을 때의 응답이 **같다** (`INVALID_RESET_CODE`).
          아이디 존재 여부를 흘리지 않기 위해서다.
        - 성공하면 방금 쓴 코드는 그 자리에서 무효가 된다 (해시가 바뀌므로 재사용 불가).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, code, user_pw]
              properties:
                user_id:
                  type: string
                  example: admin01
                code:
                  type: string
                  description: SMS 로 받은 10자리 인증코드
                  example: KQ7MB2XZP4
                user_pw:
                  type: string
                  format: password
                  description: 새 비밀번호. 영문+숫자+특수문자 3종 포함 8~64자
                  example: "Reset#2026x"
      responses:
        "200":
          description: 변경 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 비밀번호가 변경되었습니다. 새 비밀번호로 로그인해주세요.
        "400":
          description: 인증코드 불일치·만료 또는 비밀번호 규칙 위반
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_code:
                  summary: 코드가 틀렸거나 만료됨 (아이디가 없을 때도 같은 응답)
                  value:
                    code: INVALID_RESET_CODE
                    message: 인증코드가 올바르지 않거나 만료되었습니다.
                password_rule:
                  summary: 새 비밀번호가 작성규칙 위반
                  value:
                    code: BAD_REQUEST
                    message: 비밀번호는 영문자·숫자·특수문자를 모두 포함해 8자 이상이어야 합니다.
                    field: user_pw

  /api/auth/check-id:
    get:
      tags: [auth]
      summary: 아이디 중복·형식 확인 (공개 — 가입 화면의 중복확인 버튼)
      description: |
        가입 화면이 토큰 없이 부른다 (`Signup.py`). 쿼리 `user_id` 가 비었거나,
        영문·숫자 외 문자가 섞였거나, 이미 있는 아이디면 **전부 400** 이다 —
        중복도 409 가 아니라 400 이고, 본문은 공통 `{ code, message }` 가 아니라
        `{ "detail": "..." }` 다. 프론트(`api.js` 의 `checkUserId`)는 그 `detail` 을
        그대로 안내 문구로 쓴다.

        여기서 보는 형식은 **영문·숫자만**이라 가입(`POST /api/users`)의 규칙
        (5~20자, 영문 소문자 시작, `_`·`-` 허용)보다 느슨하다. 여기서 통과해도
        가입에서 `BAD_REQUEST` 가 날 수 있으니 최종 판정은 가입 응답을 따른다.

        정적 경로라 `/api/auth/{provider}` 보다 먼저 잡힌다 (`/api/auth/me` 와 같은 이유).
      parameters:
        - name: user_id
          in: query
          required: true
          description: 중복 확인할 아이디
          schema:
            type: string
            example: fireguard01
      responses:
        "200":
          description: 사용 가능한 아이디
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 사용 가능한 아이디입니다.
                  available:
                    type: boolean
                    example: true
        "400":
          description: 빈 값 · 형식 위반 · 이미 존재 (본문은 `{ detail }` 하나다)
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail:
                    type: string
                    description: 사용자에게 그대로 보여줄 수 있는 한글 메시지
              examples:
                empty:
                  summary: 아이디 없음
                  value:
                    detail: 아이디를 입력해주세요.
                format:
                  summary: 영문·숫자 외 문자 포함
                  value:
                    detail: 아이디는 영문과 숫자만 사용할 수 있습니다.
                duplicate:
                  summary: 이미 존재하는 아이디
                  value:
                    detail: 이미 존재하는 아이디입니다.

  /api/auth/email/verify-request:
    post:
      tags: [auth]
      summary: 회원가입 이메일 인증 — 인증번호 발송
      description: |
        가입 화면이 토큰 없이 부른다. 6자리 숫자 인증번호를 만들어 `email` 로 보낸다
        (SMTP 는 `.env` 의 `SMTP_SERVER`·`SMTP_PORT`·`SENDER_EMAIL`·`SENDER_PASSWORD`).
        받은 번호는 `/api/auth/verify-code`(가입 화면이 쓰는 쪽, 5분 만료) 또는
        `/api/auth/email/verify-confirm`(만료 없음) 으로 확인한다.

        - ⚠️ **인증번호는 응답 본문에 실리지 않는다.** 개발 중에는 서버 콘솔에
          `[DEBUG] 이메일: …, 인증번호: …` 로 찍히므로 그것으로 확인한다.
        - 인증번호는 **서버 메모리**에만 있다 — 서버를 재시작하면 사라지고, 같은
          이메일로 다시 요청하면 새 번호로 덮어써진다.
        - `email` 은 비어 있지만 않으면 된다 (형식 검사 없음).
        - 가입(`POST /api/users`)은 **이메일 인증 여부를 확인하지 않는다.** 인증은
          화면 흐름을 막는 용도일 뿐 서버가 강제하지는 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: newuser@fg.kr
      responses:
        "200":
          description: 발송 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 인증번호가 발송되었습니다.
        "400":
          description: 필수값 누락 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BAD_REQUEST
                message: email 는 필수입니다.
                field: email
        "500":
          description: 이메일 발송 실패 (`EMAIL_SEND_FAILED`) — SMTP 설정 누락·로그인 실패·발송 거부
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: EMAIL_SEND_FAILED
                message: 이메일 전송에 실패했습니다.

  /api/auth/email/verify-confirm:
    post:
      tags: [auth]
      summary: 회원가입 이메일 인증 — 인증번호 확인 (만료 없음)
      description: |
        `/api/auth/email/verify-request` 로 받은 인증번호를 확인한다. 맞으면 1회용으로
        소모되어 같은 번호로 다시 부르면 400 이다.

        `/api/auth/verify-code` 와 하는 일이 같지만 **만료 시간이 없고**(서버 재시작이나
        재요청으로 덮어쓰기 전까지 유효) 에러가 공통 `{ code, message }` 형식이다.
        프론트 `api.js` 의 `confirmEmailVerify` 가 이 경로를 가리키고, 가입 화면
        (`Signup.jsx`)은 `/api/auth/verify-code` 를 직접 부른다 — 둘 중 하나만 쓰면 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  example: newuser@fg.kr
                code:
                  type: string
                  description: 이메일로 받은 6자리 숫자
                  example: "482913"
      responses:
        "200":
          description: 인증 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 이메일 인증이 완료되었습니다.
                  verified:
                    type: boolean
                    example: true
        "400":
          description: 필수값 누락 또는 인증번호 불일치
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                required:
                  summary: 필수값 누락
                  value:
                    code: BAD_REQUEST
                    message: code 는 필수입니다.
                    field: code
                invalid_code:
                  summary: 인증번호가 틀렸거나 발급된 적 없음 (이미 쓴 번호도 같다)
                  value:
                    code: INVALID_VERIFY_CODE
                    message: 인증번호가 일치하지 않거나 만료되었습니다.

  /api/auth/verify-code:
    post:
      tags: [auth]
      summary: 회원가입 이메일 인증 — 인증번호 확인 (5분 만료 · 가입 화면이 쓰는 쪽)
      description: |
        `/api/auth/email/verify-request` 로 받은 인증번호를 확인한다. 발송 시각에서
        **5분**이 지나면 만료되고, 맞으면 1회용으로 소모된다. 가입 화면(`Signup.jsx`)이
        부르는 확인 경로가 이것이다.

        ⚠️ 에러 본문이 공통 `{ code, message }` 가 아니라 **`{ "error": "..." }`** 다.
        상황별로 문구만 다르고 상태 코드는 전부 400 이라, 프론트는 `error` 문구를
        그대로 띄운다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  example: newuser@fg.kr
                code:
                  type: string
                  description: 이메일로 받은 6자리 숫자 (문자열로 보낸다 — 숫자로 보내면 불일치로 처리된다)
                  example: "482913"
      responses:
        "200":
          description: 인증 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 이메일 인증이 완료되었습니다.
        "400":
          description: 필수값 누락 · 발급 안 됨 · 만료 · 불일치 (본문은 `{ error }` 하나다)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    description: 사용자에게 그대로 보여줄 수 있는 한글 메시지
              examples:
                required:
                  summary: 이메일·인증번호 중 빈 것이 있음
                  value:
                    error: 이메일과 인증번호를 모두 입력해주세요.
                not_requested:
                  summary: 발급된 적 없거나 이미 소모·만료 처리된 이메일
                  value:
                    error: 인증번호가 요청되지 않았거나 만료된 이메일입니다.
                expired:
                  summary: 발송 후 5분 경과
                  value:
                    error: 인증 시간이 만료되었습니다. 다시 요청해주세요.
                mismatch:
                  summary: 인증번호 불일치
                  value:
                    error: 인증번호가 일치하지 않습니다.

  /api/auth/{provider}:
    get:
      tags: [auth]
      summary: 소셜 로그인 — 시작
      description: |
        프로바이더 동의화면으로 **302** 한다. 프론트는
        `window.location.assign('/api/auth/kakao')` 한 줄이면 되고 `state` 를
        보관할 필요도 없다 (서버가 발급해 URL 에 싣고 콜백에서 대조한다).

        소셜 로그인은 **이 방식 하나뿐이다.** 프론트가 `code` 를 받아 백엔드에
        POST 하던 SPA/JSON 방식은 걷어냈다 — 아무도 부르지 않는 로그인 경로를
        남겨 두면 인증 표면만 넓어진다.

        동의화면에 싣는 `redirect_uri` 는
        `{OAUTH_CALLBACK_BASE}/api/auth/{provider}/callback`(백엔드 자신)이다.
        개발자 콘솔에 등록할 주소도 **이것 하나뿐이고**, 글자 하나라도 다르면
        프로바이더가 `redirect_uri_mismatch` 로 돌려보낸다.

        실패해도 JSON 을 주지 않는다 — 브라우저가 주소창째로 이동해 온 곳이라
        JSON 은 사용자 화면에 원시 텍스트로 뜬다. 지원하지 않는 프로바이더
        (`UNSUPPORTED_PROVIDER`)·키 미설정(`OAUTH_NOT_CONFIGURED`)도 콜백과 같은
        방식으로 프론트에 302 하며, 코드는 프래그먼트의 `oauth_error` 에 실린다.

        ⚠️ 경로 모양이 `/api/auth/me` 와 겹치지만 정적 경로가 우선하므로 `/me` 는
        그대로 동작한다. 대신 `/api/auth` 아래에 동적 세그먼트로 시작하는 GET 을
        더 추가하면 서로 잡아먹는다.
      parameters:
        - $ref: "#/components/parameters/OauthProvider"
      responses:
        "302":
          description: |
            동의화면(정상) 또는 프론트(지원하지 않는 프로바이더·키 미설정)로 이동.
            본문은 없다.
          headers:
            Location:
              description: |
                프로바이더 동의화면 주소. `redirect_uri` 는 백엔드 콜백을 가리키고
                `state` 가 실려 있다. 실패 시에는
                `{OAUTH_REDIRECT_BASE}/#oauth_error=<code>` 가 된다.
              schema:
                type: string
              example: https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=...&redirect_uri=http%3A%2F%2Flocalhost%3A5000%2Fapi%2Fauth%2Fkakao%2Fcallback&state=...

  /api/auth/{provider}/callback:
    get:
      tags: [auth]
      summary: 소셜 로그인 — 프로바이더 콜백
      description: |
        프로바이더가 **사용자의 브라우저를 여기로 되돌려보낸다.** 프론트가 직접
        부르는 API 가 아니다 — 개발자 콘솔에 등록하는 주소가 곧 이 경로다.

        백엔드가 `code` 를 토큰·사용자정보로 바꾸고 계정을 찾거나 만든 뒤
        (`user_role: VIEWER`, `user_status: ACTIVE`, 비밀번호 없음) 우리 JWT 를
        발급해 프론트로 302 한다. 관제 권한(`ADMIN`)이 필요하면 관리자가 따로
        올려준다.

        ⚠️ **이메일이 같은 일반 계정과 자동으로 연결되지 않는다.** 프로바이더가 그
        이메일의 소유를 실제로 검증했는지 보장할 수 없어서다. 검증하지 않는 곳에
        피해자의 이메일로 가입해 로그인하면 우리 쪽 계정을 그대로 가져가게 된다.
        그래서 `admin@fg.kr` 로 쓰는 계정이 이미 있어도 **별개 계정**이 생긴다.
        계정 두 개를 합치는 것은 본인 확인을 거친 별도 기능이어야 할 문제라
        이 API 의 범위 밖이다.

        비밀번호가 없는 계정이라 `PUT /api/users/password` 와
        `/api/auth/password-reset/*` 는 쓸 수 없다 (400 `SOCIAL_ACCOUNT`).
        로그아웃(`POST /api/auth/logout`)은 일반 계정과 똑같이 동작한다.

        **성공·실패 모두 302 이고 본문은 없다.** 브라우저가 응답을 따라오는
        중이라 JSON 을 주면 사용자에게 원시 JSON 이 보인다.

        결과는 프론트 주소의 **프래그먼트(`#`)** 에 실린다:
          - 성공 → `{OAUTH_REDIRECT_BASE}/#access_token=<JWT>`
          - 실패 → `{OAUTH_REDIRECT_BASE}/#oauth_error=<code>`

        쿼리스트링(`?`)이 아니라 프래그먼트인 이유: 쿼리는 웹서버·프록시 접근로그에
        쌓이고 다음 요청의 `Referer` 헤더로도 새어 나가지만, 프래그먼트는 브라우저가
        서버로 보내지 않는다. 실리는 것이 로그인 토큰이라 그 차이가 곧 유출 여부다.

        **사용자 정보는 싣지 않는다.** 프론트는 받은 토큰으로 `GET /api/auth/me` 를
        부르면 된다 (URL 에 개인정보를 넣지 않는다).

        `oauth_error` 에 들어가는 값:
        `ACCESS_DENIED`(사용자가 동의화면에서 취소) ·
        `UNSUPPORTED_PROVIDER` · `OAUTH_NOT_CONFIGURED` ·
        `INVALID_OAUTH_STATE`(state 위조·만료, 약 10분) ·
        `OAUTH_PROVIDER_ERROR`(프로바이더 통신 실패, `code` 누락 포함) ·
        `ACCOUNT_SUSPENDED` · `ACCOUNT_WITHDRAWN` ·
        `DUPLICATE_USER_ID`(합성한 `user_id` 가 다른 계정과 겹쳤다 — 자동으로 이름을
        바꿔 만들지 않는다. 계정이 조용히 늘어나는 것보다 사람이 보는 편이 낫다).
        문자열은 다른 API 가 JSON `code` 로 쓰는 것과 같은 것을 쓴다.
      parameters:
        - $ref: "#/components/parameters/OauthProvider"
        - name: code
          in: query
          required: false
          description: 프로바이더가 발급한 authorization code (사용자가 거부하면 오지 않는다)
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: 시작 라우트가 URL 에 실어 보낸 값. 서버가 HMAC 으로 대조한다
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: |
            프로바이더가 알려오는 오류. `access_denied` 는 사용자가 취소한 것이라
            `ACCESS_DENIED` 로, 나머지는 `OAUTH_PROVIDER_ERROR` 로 안내한다.
          schema:
            type: string
          example: access_denied
      responses:
        "302":
          description: 프론트로 이동 (성공·실패 모두). 본문은 없다.
          headers:
            Location:
              description: |
                `{OAUTH_REDIRECT_BASE}/#access_token=<JWT>` 또는
                `{OAUTH_REDIRECT_BASE}/#oauth_error=<code>`.
              schema:
                type: string
              example: http://localhost:5173/#access_token=eyJhbGciOiJIUzI1NiIs...

  # ---------------------------------------------------------------- 회원가입 이메일 인증 — 옛 경로 (Signup.py)
  /api/email/verify-request:
    post:
      tags: [auth]
      summary: 회원가입 이메일 인증 — 인증번호 발송 (옛 경로)
      description: |
        `Signup.py` 에 남아 있는 이전 경로다. `/api/auth/email/verify-request` 와
        같은 일을 하지만 **저장소가 따로라 서로 호환되지 않는다** — 여기서 받은
        번호는 `/api/email/verify-confirm` 으로만 확인된다. 프론트는 이 경로를
        부르지 않으며(`/api/auth/email/*` 을 쓴다), 새로 붙일 때도 그쪽을 쓴다.

        - SMTP 계정이 코드에 고정돼 있어 `.env` 설정을 따르지 않는다.
        - 필수값 검증이 없다. `email` 이 비어도 400 이 아니라 발송 단계에서
          `INTERNAL_ERROR` 500 이 난다.
        - 인증번호는 응답에 실리지 않고 서버 콘솔에만 찍힌다. 만료 시간은 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: newuser@fg.kr
      responses:
        "200":
          description: 발송 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 인증번호가 발송되었습니다.
        "500":
          description: 이메일 발송 실패 또는 `email` 누락 (`INTERNAL_ERROR`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INTERNAL_ERROR
                message: 서버 내부 오류가 발생했습니다.

  /api/email/verify-confirm:
    post:
      tags: [auth]
      summary: 회원가입 이메일 인증 — 인증번호 확인 (옛 경로)
      description: |
        `/api/email/verify-request` 로 받은 인증번호를 확인한다 (`Signup.py`).
        맞으면 1회용으로 소모된다. 틀리면 400 인데 본문이 공통 형식이 아니라
        `{ "detail": "..." }` 다. `/api/auth/email/verify-request` 로 받은 번호는
        여기서 확인되지 않는다 (저장소가 다르다).

        여기서 인증한 결과는 `Signup.py` 의 가입 핸들러만 보는데, `POST /api/users` 는
        먼저 등록된 `user_routes` 쪽이 받으므로 **가입에는 아무 영향이 없다.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  example: newuser@fg.kr
                code:
                  type: string
                  description: 이메일로 받은 6자리 숫자
                  example: "482913"
      responses:
        "200":
          description: 인증 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 이메일 인증이 완료되었습니다.
                  verified:
                    type: boolean
                    example: true
        "400":
          description: 인증번호 불일치 또는 발급된 적 없음 (본문은 `{ detail }` 하나다)
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail:
                    type: string
                    description: 사용자에게 그대로 보여줄 수 있는 한글 메시지
              example:
                detail: 인증번호가 일치하지 않거나 만료되었습니다.

  # ---------------------------------------------------------------- 계정
  /api/users:
    get:
      tags: [users]
      summary: 계정 목록 (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: user_status
          in: query
          description: 계정 상태 필터
          schema:
            $ref: "#/components/schemas/UserStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [users]
      summary: 계정 등록 (공개 — 가입 화면이 토큰 없이 부른다)
      description: |
        **인증이 없는 경로다.** 가입 화면이 토큰을 갖기 전에 부르기 때문이다.

        그래서 `user_role` 은 요청자가 정할 수 없다 — **ADMIN 토큰을 실어 보낸
        경우에만** 본문의 값이 반영되고, 그 외에는 무엇을 보내든 `VIEWER` 로
        고정된다. 이 방어가 없으면 누구나 `user_role: "ADMIN"` 을 보내 관리자
        계정을 만들 수 있다. 남을 승격시키는 것은 `PUT /api/users/{user_no}` 다.

        아이디·비밀번호 작성규칙을 여기서만 검사한다.
        - `user_id`: 5~20자, 영문 소문자 시작, 소문자·숫자·`_`·`-`
        - `user_pw`: 영문+숫자+특수문자 3종 포함 8~64자.
          같은 문자 3연속·연속 문자열(1234, abcd)·키보드 배열(qwer)·아이디 포함 금지
        - `user_phone`: 하이픈 없이 숫자만 (`01012345678`)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_no:
                    type: integer
                    format: int64
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                required:
                  summary: 필수값 누락
                  value:
                    code: BAD_REQUEST
                    message: user_name 는 필수입니다.
                    field: user_name
                user_id_rule:
                  summary: 아이디 작성규칙 위반
                  value:
                    code: BAD_REQUEST
                    message: user_id 는 5~20자의 영문 소문자·숫자·특수기호(_,-)만 사용할 수 있으며, 시작은 영문 소문자여야 합니다.
                    field: user_id
                password_rule:
                  summary: 비밀번호 작성규칙 위반
                  value:
                    code: BAD_REQUEST
                    message: 비밀번호는 영문자·숫자·특수문자를 모두 포함해 8자 이상이어야 합니다.
                    field: user_pw
                phone_format:
                  summary: 전화번호 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: "user_phone 은 하이픈 없이 숫자만 입력해야 합니다. (예: 01012345678)"
                    field: user_phone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/DuplicateUserId"

  /api/users/password:
    put:
      tags: [users]
      summary: 본인 비밀번호 변경
      description: |
        로그인한 사용자가 **자기 비밀번호만** 바꾼다. 대상 `user_no` 를 받지 않고
        토큰에서 꺼내 쓰므로, 남의 비밀번호를 바꿀 통로가 애초에 없다.

        현재 비밀번호를 함께 받아 대조한다 — 토큰만으로 통과시키면 자리를 비운
        사이 브라우저를 잡은 사람이 비밀번호를 갈아버릴 수 있다.

        새 비밀번호는 계정 등록·수정과 같은 작성규칙을 거친다.
        비밀번호를 잊어버린 경우는 이 API 가 아니라
        `/api/auth/password-reset/*` 쪽이다.

        소셜 로그인 계정은 바꿀 비밀번호가 애초에 없다 — 400 `SOCIAL_ACCOUNT` 다.
        프론트는 이 계정에 비밀번호 변경 화면 자체를 띄우지 않는 편이 낫다
        (`GET /api/auth/me` 로는 구분되지 않으니 소셜 로그인으로 들어왔다는 사실을
        프론트가 기억해 두면 된다).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  description: 현재 비밀번호
                new_password:
                  type: string
                  description: 새 비밀번호 (작성규칙 적용)
      responses:
        "200":
          description: 변경 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: 비밀번호가 성공적으로 변경되었습니다.
        "400":
          description: 입력 누락 · 소셜 계정 · 현재 비밀번호 불일치 · 작성규칙 위반
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  summary: 필수값 누락
                  value:
                    code: BAD_REQUEST
                    message: 현재 비밀번호와 새 비밀번호를 모두 입력해주세요.
                social:
                  summary: 소셜 로그인 계정 (바꿀 비밀번호가 없다)
                  value:
                    code: SOCIAL_ACCOUNT
                    message: 소셜 로그인 계정은 비밀번호를 변경할 수 없습니다.
                    field: user_pw
                wrong_current:
                  summary: 현재 비밀번호 불일치
                  value:
                    code: INVALID_CURRENT_PASSWORD
                    message: 현재 비밀번호가 일치하지 않습니다.
                password_rule:
                  summary: 새 비밀번호 작성규칙 위반
                  value:
                    code: BAD_REQUEST
                    message: 비밀번호는 영문자·숫자·특수문자를 모두 포함해 8자 이상이어야 합니다.
                    field: user_pw
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/users/{user_no}:
    put:
      tags: [users]
      summary: 계정 수정 · 정지 · 탈퇴
      description: |
        ADMIN 은 모든 계정의 모든 필드를, 일반 사용자는 **본인 계정의**
        `user_name`·`user_email`·`user_phone`·`user_gender`·`user_address`·`user_pw`
        만 수정할 수 있다. `user_role`·`user_status` 가 하나라도 섞이면 요청 전체를
        403 으로 거부한다 (부분 적용 없음).

        `user_status: "WITHDRAWN"` 을 보내면 탈퇴 일시가 함께 기록된다.
        보낸 필드만 갱신되며, 갱신할 필드가 하나도 없으면 400 이다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserNo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_no:
                    type: integer
                    format: int64
        "400":
          description: 필수값 누락 또는 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                nothing_to_update:
                  summary: 수정할 필드 없음
                  value:
                    code: BAD_REQUEST
                    message: 수정할 필드가 없습니다.
                password_rule:
                  summary: 비밀번호 작성규칙 위반
                  value:
                    code: BAD_REQUEST
                    message: 비밀번호에 연속된 문자열(1234, abcd 등)은 사용할 수 없습니다.
                    field: user_pw
                phone_format:
                  summary: 전화번호 형식 오류
                  value:
                    code: BAD_REQUEST
                    message: "user_phone 은 하이픈 없이 숫자만 입력해야 합니다. (예: 01012345678)"
                    field: user_phone
                social_password:
                  summary: 소셜 계정에 비밀번호 설정 시도
                  value:
                    code: SOCIAL_ACCOUNT
                    message: 소셜 로그인 계정에는 비밀번호를 설정할 수 없습니다.
                    field: user_pw
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenUserUpdate"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/users/{user_no}/activities:
    get:
      tags: [users]
      summary: 활동이력 (지정 사용자)
      description: |
        해당 사용자의 활동이력을 **최신순**으로 준다. 남기는 종류는
        `ActivityType` 참고. IP·User-Agent 는 수집하지 않는다.

        권한은 계정 수정과 같은 규칙이다 — ADMIN 은 전체, 일반 사용자는 본인 것만.
        활동 이력은 감사 자료라 남의 것을 아무나 볼 수 없다.

        **본인 이력만 필요하면 `GET /api/me/activities` 를 쓸 것.** 이 경로는
        관리자가 남의 이력을 보는 화면(회원 상세)을 위한 것이다.

        회원 상세 화면의 "최근 로그인"은 `?size=1` 로 받은 첫 `LOGIN` 항목을 쓰면 된다.

        주의: 실패한 시도는 여기 쌓이지 않는다. 그리고 `LOGOUT` 은 프론트가
        `POST /api/auth/logout` 을 불러야만 생긴다 — 브라우저를 그냥 닫으면
        `LOGIN` 만 있고 짝이 되는 `LOGOUT` 이 없는 행이 남는다. 정상이다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserNo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 조회 성공 (이력이 없으면 `items` 가 빈 배열)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserActivity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 남의 활동이력 조회 시도 (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: FORBIDDEN
                message: 본인 계정의 활동이력만 조회할 수 있습니다.
        "404":
          $ref: "#/components/responses/UserNotFound"

  # ---------------------------------------------------------------- 내 정보
  /api/me/activities:
    get:
      tags: [me]
      summary: 내 활동이력
      description: |
        **토큰 주인의** 활동이력을 최신순으로 준다. 남기는 종류는 `ActivityType` 참고.

        `GET /api/users/{user_no}/activities` 와 같은 표를 읽지만 `user_no` 를
        URL 로 받지 않는다. 그래서 남의 번호를 넣어 훔쳐보는 일이 원천적으로
        불가능하고, **403 도 404 도 나오지 않는다** — 토큰이 곧 신원이기 때문이다.
        ADMIN 이라도 이 경로로는 본인 이력만 나온다.

        마이페이지의 "활동 이력" 목록이 쓸 엔드포인트다. 이력이 없으면
        `items` 가 빈 배열이고, 그것 말고 다른 응답은 없다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 조회 성공 (이력이 없으면 `items` 가 빈 배열)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserActivity"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------- 카메라
  /api/cctvs:
    get:
      tags: [cctvs]
      summary: 카메라 목록
      description: |
        페이징이 없다. 필터(`cctv_status`, `user_no`)를 주면 걸러진 목록이,
        아무것도 안 주면 전체가 `cctv_no` 오름차순으로 내려온다.
        ITS 카메라의 `cctv_stream_url` 은 토큰이 만료되므로 응답 직전에 최신 값으로
        갈아끼운다 (외부 API 가 죽어 있으면 저장된 주소가 그대로 나간다).
      security:
        - bearerAuth: []
      parameters:
        - name: cctv_status
          in: query
          schema:
            $ref: "#/components/schemas/CctvStatus"
        - name: user_no
          in: query
          description: |
            해당 사용자가 소유(담당)하는 카메라만 — 관리자 화면의 "이 사용자가 담당하는
            카메라" 목록에 쓴다. 값은 `Cctv.user_no` 와 같은 사용자 번호다.

            빼면 전체가 나온다. `cctv_status` 와 함께 주면 AND 로 걸린다
            (예: `?user_no=3&cctv_status=ACTIVE` → 3번 사용자의 ACTIVE 카메라만).
            담당 카메라가 없는 사용자는 404 가 아니라 `{"items": []}` 로 200 이다.
          schema:
            type: integer
            format: int64
            example: 3
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Cctv"
        "400":
          description: 형식 오류 (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_int:
